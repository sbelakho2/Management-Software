# Pre-commit hooks for Sensei OS
# Install: pip install pre-commit && pre-commit install
#
# Runs automatically on `git commit`. Use `pre-commit run --all-files` to
# check everything. Mirrors the CI gates in .github/workflows/sensei-rs-ci.yml.

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements

  # Rust formatting & linting (same commands as CI, --locked)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (check)
        entry: cargo fmt --all -- --check
        language: system
        working_dir: sensei-rs
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (workspace, --locked, -D warnings)
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        working_dir: sensei-rs
        pass_filenames: false

      - id: cargo-test
        name: cargo test (workspace, --locked)
        entry: cargo test --workspace --locked
        language: system
        working_dir: sensei-rs
        pass_filenames: false
        stages: [push]

      - id: gitleaks
        name: gitleaks secret scan
        entry: gitleaks detect --source . --no-banner --redact
        language: system
        pass_filenames: false
