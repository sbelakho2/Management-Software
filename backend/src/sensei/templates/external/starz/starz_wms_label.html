<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @page {
            size: 100mm 50mm;
            margin: 0;
        }
        body {
            font-family: 'DejaVu Sans', sans-serif;
            margin: 0;
            padding: 2mm;
            width: 96mm;
            height: 46mm;
            border: 1px solid #000;
        }
        .header {
            border-bottom: 1px solid #000;
            padding-bottom: 1mm;
            margin-bottom: 1mm;
            display: flex;
            justify-content: space-between;
        }
        .logo { font-weight: bold; font-size: 10pt; }
        .type { font-weight: bold; font-size: 12pt; border: 1px solid #000; padding: 0 2mm; }
        .barcode-placeholder {
            width: 100%;
            height: 15mm;
            border: 1px dashed #ccc;
            text-align: center;
            line-height: 15mm;
            font-size: 8pt;
            margin: 1mm 0;
        }
        .lpn-code {
            text-align: center;
            font-weight: bold;
            font-size: 14pt;
            letter-spacing: 2mm;
        }
        .details {
            display: flex;
            flex-wrap: wrap;
            font-size: 9pt;
            margin-top: 1mm;
        }
        .detail-item { width: 50%; margin-bottom: 1mm; }
        .label { font-size: 7pt; color: #666; text-transform: uppercase; display: block; }
        .value { font-weight: bold; }
        .footer {
            position: absolute;
            bottom: 1mm;
            right: 2mm;
            font-size: 7pt;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">STARZ ELECTRONICS</div>
        <div class="type">LPN</div>
    </div>
    
    <div class="barcode-placeholder">
        [BARCODE: {{ data.lpn_code }}]
    </div>
    
    <div class="lpn-code">{{ data.lpn_code }}</div>
    
    <div class="details">
        <div class="detail-item" style="width: 100%;">
            <span class="label">Article</span>
            <span class="value">{{ data.product_name }}</span>
        </div>
        <div class="detail-item">
            <span class="label">Quantité</span>
            <span class="value">{{ data.quantity }} {{ data.unit }}</span>
        </div>
        <div class="detail-item">
            <span class="label">Emplacement</span>
            <span class="value">{{ data.location_code if data.location_code else 'N/A' }}</span>
        </div>
    </div>
    
    <div class="footer">
        Sensei OS - {{ now.strftime('%d/%m/%Y %H:%M') }}
    </div>
</body>
</html>
