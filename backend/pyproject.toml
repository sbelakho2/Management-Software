[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensei-os-backend"
version = "1.0.0"
description = "Sensei OS - Intelligent Management & Teaching System Backend"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    { name = "Starz Morocco", email = "dev@starzmorocco.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiosmtplib>=3.0.0",
    "fastapi>=0.109.0",
    "gunicorn>=21.2.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "boto3>=1.42.88",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "apscheduler>=3.10.4",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "tenacity>=8.2.3",
    "structlog>=24.1.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "weasyprint>=60.2",
    "jinja2>=3.1.3",
    "email-validator>=2.0.0",
    "sentence-transformers>=2.3.1",
    "transformers>=4.36.0",
    "llama-cpp-python>=0.2.0",
    "onnxruntime>=1.17.0",
    "onnx>=1.16.0",
    "onnxscript>=0.1.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "faker>=22.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.11",
    "pre-commit>=3.6.0",
    "types-python-jose>=3.3.4",
    "types-psutil>=5.9.0",
]

[project.scripts]
sensei = "sensei.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Note: Removed -x flag to show all test failures instead of stopping at first failure
# Use --maxfail=N if you want to limit failures (e.g., --maxfail=10)
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "asyncio: Async tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501", "B008", "B009", "B010"]

[tool.ruff.isort]
known-first-party = ["sensei"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Per-module overrides for strict checking on core modules
[[tool.mypy.overrides]]
module = ["sensei.api.*", "sensei.models.*", "sensei.core.*"]
disallow_untyped_defs = false
warn_return_any = false

[tool.coverage.run]
source = ["src/sensei"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
