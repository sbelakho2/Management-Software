# =============================================================================
# docker-compose.yml — Sensei OS Development & Production Stacks
# =============================================================================
# This file orchestrates the Sensei OS Rust/Zig stack plus integration services
# for the tri-system architecture (Sensei + erpStarz + CRM-v2).
#
# PROFILE CONTRACT (docker compose --profile ...):
#   - default (no profile): infrastructure only — db, minio, nats.
#   - dev:        docker compose --profile dev up -d          (development stack)
#   - production: docker compose --profile production up -d   (production stack;
#                 also set SENSEI_ENV=production and swap in
#                 caddy/Caddyfile.production for the caddy service)
#   - integration: docker compose --profile integration up -d (tri-system services)
#   Alternatively set COMPOSE_PROFILES=dev in .env to keep plain
#   `docker compose up -d` behavior.
#
# Environment variable reference — the CANONICAL contract lives in
# .env.example (single source of truth for Compose/Helm/Rust). Credential
# variables (POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD) are REQUIRED.
#
#   Tri-system integration:
#     STARZ_ERP_DATABASE_URL    — PostgreSQL connection for erpStarz data sync
#     CRM_V2_DATABASE_URL       — PostgreSQL connection for CRM-v2 data sync
#     STARZ_ERP_API_URL         — REST API base URL for erpStarz
#     CRM_V2_API_URL            — REST API base URL for CRM-v2
# =============================================================================

services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg16
    container_name: sensei-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      POSTGRES_DB: ${POSTGRES_DB:-sensei}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - default_statistics_target=200
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - statement_timeout=30000
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sensei} -d ${POSTGRES_DB:-sensei}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - sensei-network

  # MinIO S3-compatible object storage
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: sensei-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sensei}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD not set}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - sensei-network

  # NATS JetStream message broker (event bus for Rust workers)
  nats:
    image: nats:2.10-alpine
    container_name: sensei-nats
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    # JetStream with durable storage and token authentication. The monitor
    # port is exposed only in the DEV profile (see docker-compose.prod.yml).
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--store_dir"
      - "/data"
      - "--auth"
      - "${NATS_TOKEN:-sensei_dev_token}"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - sensei-network

  # Rust Axum API
  sensei-api:
    build:
      context: ./sensei-rs
      dockerfile: Dockerfile
    container_name: sensei-rs-api
    restart: unless-stopped
    profiles: ["dev", "production"]
    environment:
      SENSEI_ENV: ${SENSEI_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-sensei}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}@db:5432/${POSTGRES_DB:-sensei}
      NATS_URL: ${NATS_URL:-nats://${NATS_TOKEN:-sensei_dev_token}@nats:4222}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_PREVIOUS_SIGNING_KEY: ${JWT_PREVIOUS_SIGNING_KEY:-}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      SENSEI_CEO_PASSWORD: ${SENSEI_CEO_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      REALTIME_TICKET_TTL_SECONDS: ${REALTIME_TICKET_TTL_SECONDS:-300}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-300}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sensei}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD not set}
      S3_BUCKET: ${S3_BUCKET:-sensei-uploads}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@sensei.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Sensei OS}
      # Observability
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - sensei-network

  # Rust NATS Workers
  sensei-workers:
    build:
      context: ./sensei-rs
      dockerfile: Dockerfile
    container_name: sensei-rs-workers
    restart: unless-stopped
    profiles: ["dev", "production"]
    # The image CMD runs the API; the worker needs its own entrypoint.
    entrypoint: ["/usr/local/bin/sensei-workers"]
    environment:
      SENSEI_ENV: ${SENSEI_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-sensei}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}@db:5432/${POSTGRES_DB:-sensei}
      NATS_URL: ${NATS_URL:-nats://${NATS_TOKEN:-sensei_dev_token}@nats:4222}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_PREVIOUS_SIGNING_KEY: ${JWT_PREVIOUS_SIGNING_KEY:-}
      REALTIME_TICKET_TTL_SECONDS: ${REALTIME_TICKET_TTL_SECONDS:-300}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-300}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sensei}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD not set}
      S3_BUCKET: ${S3_BUCKET:-sensei-uploads}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@sensei.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Sensei OS}
    depends_on:
      nats:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - sensei-network

  # Caddy reverse proxy (dev: Caddyfile; production: Caddyfile.production)
  caddy:
    image: caddy:2-alpine
    container_name: sensei-caddy
    restart: unless-stopped
    profiles: ["dev", "production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sensei-api
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - sensei-network

  # =============================================================================
  # Integration Services (Tri-System: erpStarz + CRM-v2)
  # =============================================================================

  # Shared PostgreSQL for cross-system integration data (erpStarz sync, CRM-v2 sync)
  integration-db:
    image: pgvector/pgvector:pg16
    container_name: sensei-integration-db
    restart: unless-stopped
    profiles:
      - integration
    environment:
      POSTGRES_USER: ${INTEGRATION_DB_USER:-integration}
      POSTGRES_PASSWORD: ${INTEGRATION_DB_PASSWORD:-integration_dev_password}
      POSTGRES_DB: ${INTEGRATION_DB_NAME:-integration}
    volumes:
      - integration_db_data:/var/lib/postgresql/data
    ports:
      - "${INTEGRATION_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INTEGRATION_DB_USER:-integration} -d ${INTEGRATION_DB_NAME:-integration}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - sensei-network

  # Shared Redis for cross-system event streaming / pub-sub (erpStarz ↔ CRM-v2 ↔ Sensei)
  integration-redis:
    image: redis:7-alpine
    container_name: sensei-integration-redis
    restart: unless-stopped
    profiles:
      - integration
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lfu
      --requirepass ${INTEGRATION_REDIS_PASSWORD:-integration_dev_password}
    volumes:
      - integration_redis_data:/data
    ports:
      - "${INTEGRATION_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${INTEGRATION_REDIS_PASSWORD:-integration_dev_password} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - sensei-network

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  nats_data:
  integration_db_data:
  integration_redis_data:

networks:
  sensei-network:
    driver: bridge
