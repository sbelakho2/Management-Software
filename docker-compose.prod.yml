# =============================================================================
# docker-compose.prod.yml — Production topology
#
# Only the Caddy edge (80/443) is exposed to the host. PostgreSQL, NATS,
# MinIO and the services are NOT published to host interfaces; secrets come
# from the environment (.env), never defaults. NATS runs authenticated with
# a token and durable JetStream storage.
#
# Usage:  docker compose -f docker-compose.prod.yml up -d
#         (all services are active in this production file; no --profile
#          flag is needed — profiles are a dev-compose concept)
# =============================================================================
name: sensei-prod

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-sensei}
      # Creates the non-owner sensei_app role (RLS depends on the app NOT
      # being the table owner), the DEPLOYMENT-ONLY sensei_migrator role
      # (twenty-fourth audit P0; twenty-fifth audit P0: NOSUPERUSER
      # BYPASSRLS NOCREATEDB — FORCE RLS binds the table owner too, so the
      # migrator needs the RLS bypass for the chain's cross-tenant
      # FORCE-RLS seeds; databases are created by the initdb superuser,
      # never by the migrator) and the NOLOGIN sensei_governance_definer
      # role that owns the federation-governance functions. Twenty-eighth
      # audit P0: this FIRST initdb run happens BEFORE the migration
      # chain, so it pre-grants the definer USAGE + CREATE ON SCHEMA
      # public — migration 165's ALTER FUNCTION ... OWNER TO
      # sensei_governance_definer requires schema CREATE of the new owner
      # — and the definer's guarded table SELECT grants no-op here (the
      # tables do not exist yet); the post-migration `grants` one-shot
      # below applies those once the chain created the tables.
      SENSEI_APP_PASSWORD: ${SENSEI_APP_PASSWORD:?SENSEI_APP_PASSWORD required}
      SENSEI_MIGRATOR_PASSWORD: ${SENSEI_MIGRATOR_PASSWORD:?SENSEI_MIGRATOR_PASSWORD required}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # First-boot init (docker-entrypoint-initdb.d, sorted): extensions +
      # tuning (./postgres-init/01-init.sql), then the canonical production
      # role script (docker/postgres-init/01-app-role.sh — the ONE source
      # of both role definitions and the app grants; db-contract CI
      # executes the same file verbatim).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres-init/01-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sensei}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration-owner bootstrap (twenty-fourth audit P0;
  # twenty-fifth audit P0: the role is deployment-only — BYPASSRLS
  # NOCREATEDB, NOT CREATEDB): connects AS sensei_migrator (BYPASSRLS so
  # the chain can seed/backfill the FORCE-RLS tables cross-tenant without
  # app.tenant_id; owner of every object the chain creates) and applies
  # the full migration chain via `--migrate-only`, then exits 0.
  # The API/workers depend on this service COMPLETING SUCCESSFULLY, so they
  # never start against an un-migrated schema and never attempt DDL as the
  # non-owner sensei_app. sensei_migrator is NEVER the runtime app
  # identity — only this bootstrap uses it. It runs only AFTER the
  # `bootstrap` one-shot below converged the roles and pre-migration
  # grants (twenty-eighth audit P0): migration 165's
  # ALTER FUNCTION ... OWNER TO sensei_governance_definer executes as
  # this non-superuser role, and the definer must already hold USAGE +
  # CREATE ON SCHEMA public or the clean bootstrap fails there.
  migrate:
    build:
      context: ./sensei-rs
      dockerfile: Dockerfile
    restart: "no"
    command: ["--migrate-only"]
    environment:
      SENSEI_ENV: production
      DATABASE_URL: postgres://sensei_migrator:${SENSEI_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:-sensei}
      # AppConfig::from_env() validates JWT_SECRET in production before the
      # migrate-only path runs; reuse the stack's real secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  # Pre-migration canonical role-script convergence (twenty-eighth audit
  # P0 — governance ownership on a clean bootstrap): the canonical script
  # (docker/postgres-init/01-app-role.sh, the ONE source of the role
  # definitions and grants) must run BEFORE the migration chain AND again
  # AFTER it. On a FRESH volume the db container's initdb mount already
  # ran it pre-migration; this one-shot re-runs the IDENTICAL script
  # against volumes whose initdb predates the definer's schema grant — an
  # upgrade that first applies migration 165 would otherwise fail there
  # (ALTER ... OWNER requires the new owner to hold CREATE on the
  # function's schema). Every statement is idempotent, so on a fresh
  # volume the run converges to the exact same state initdb produced.
  # Runs as the bootstrap superuser over TCP (the script connects with
  # --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"; PGPASSWORD is
  # the image's own password variable reused for the connection).
  bootstrap:
    image: pgvector/pgvector:pg16
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/sensei/01-app-role.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-sensei}
      SENSEI_APP_PASSWORD: ${SENSEI_APP_PASSWORD:?SENSEI_APP_PASSWORD required}
      SENSEI_MIGRATOR_PASSWORD: ${SENSEI_MIGRATOR_PASSWORD:?SENSEI_MIGRATOR_PASSWORD required}
    volumes:
      - ./docker/postgres-init/01-app-role.sh:/opt/sensei/01-app-role.sh:ro
    depends_on:
      db:
        condition: service_healthy

  # Post-migration canonical grants re-run (twenty-eighth audit P0): the
  # migration chain has now created the FORCE-RLS federation tables the
  # governance definer's SECURITY DEFINER bodies read, and BYPASSRLS does
  # NOT grant table SELECT — so the canonical role script runs a SECOND
  # time, and its table-existence guards fire now that
  # federation_memberships, site_manifests, country_policies and
  # country_policy_versions exist, granting sensei_governance_definer
  # SELECT on each (its bodies execute under exactly those privileges).
  # CI's clean-bootstrap gate (db-contract.yml) reproduces this same
  # two-phase order. sensei-api / sensei-workers start only after this
  # one-shot completed successfully.
  grants:
    image: pgvector/pgvector:pg16
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/sensei/01-app-role.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-sensei}
      SENSEI_APP_PASSWORD: ${SENSEI_APP_PASSWORD:?SENSEI_APP_PASSWORD required}
      SENSEI_MIGRATOR_PASSWORD: ${SENSEI_MIGRATOR_PASSWORD:?SENSEI_MIGRATOR_PASSWORD required}
    volumes:
      - ./docker/postgres-init/01-app-role.sh:/opt/sensei/01-app-role.sh:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command:
      - "-js"
      - "--store_dir"
      - "/data"
      - "--auth"
      - "${NATS_TOKEN:?NATS_TOKEN required}"
      # Monitoring endpoint: the healthcheck probes /healthz on 8222.
      - "-m"
      - "8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio-data:/data

  sensei-api:
    build:
      context: ./sensei-rs
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SENSEI_ENV: production
      # The app connects as sensei_app (non-owner) so RLS is enforced.
      DATABASE_URL: postgres://sensei_app:${SENSEI_APP_PASSWORD}@db:5432/${POSTGRES_DB:-sensei}
      NATS_URL: nats://${NATS_TOKEN}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_PREVIOUS_SIGNING_KEY: ${JWT_PREVIOUS_SIGNING_KEY:-}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-sensei}
      SENSEI_ADMIN_EMAIL: ${SENSEI_ADMIN_EMAIL:?SENSEI_ADMIN_EMAIL required}
      SENSEI_ADMIN_PASSWORD: ${SENSEI_ADMIN_PASSWORD:?SENSEI_ADMIN_PASSWORD required}
      SENSEI_CEO_EMAIL: ${SENSEI_CEO_EMAIL:-ceo@starz.com}
      SENSEI_CEO_PASSWORD: ${SENSEI_CEO_PASSWORD:?SENSEI_CEO_PASSWORD required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # The post-migration canonical grants re-run must complete before the
      # runtime services start (twenty-eighth audit P0): it grants the
      # governance definer the SELECT privileges its SECURITY DEFINER
      # bodies execute under.
      grants:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  sensei-workers:
    build:
      context: ./sensei-rs
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/sensei-workers"]
    # The worker is not an HTTP service: probe DB + NATS connectivity via
    # its own --healthcheck subcommand (no pgrep, no HTTP).
    healthcheck:
      test: ["CMD", "sensei-workers", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      SENSEI_ENV: production
      # The app connects as sensei_app (non-owner) so RLS is enforced.
      DATABASE_URL: postgres://sensei_app:${SENSEI_APP_PASSWORD}@db:5432/${POSTGRES_DB:-sensei}
      NATS_URL: nats://${NATS_TOKEN}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-sensei}
    depends_on:
      db:
        condition: service_healthy
      # The workers still probe the migration state at startup; they must
      # start only AFTER the migration-owner bootstrap completed, or their
      # app-role connection could not even read _sqlx_migrations. The
      # post-migration `grants` re-run must also have completed
      # (twenty-eighth audit P0) so the governance definer holds the
      # SELECT grants its SECURITY DEFINER bodies execute under.
      migrate:
        condition: service_completed_successfully
      grants:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - sensei-api

volumes:
  pg-data:
  nats-data:
  minio-data:
  caddy-data:
