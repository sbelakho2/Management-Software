apiVersion: v2
name: sensei
description: Sensei OS - Manufacturing & Quality Management Platform
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - manufacturing
  - quality-management
  - lean
  - tps
  - rfq
  - quotes
maintainers:
  - name: Sensei Team
    email: ops@sensei-os.com
home: https://sensei-os.com
sources:
  - https://github.com/sensei-os/management-software
dependencies:
  - name: postgresql
    version: "15.5.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: nats
    version: "1.1.0"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
