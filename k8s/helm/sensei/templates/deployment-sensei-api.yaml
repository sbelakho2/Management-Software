{{- if .Values.senseiApi.enabled }}
# =============================================================================
# sensei-api Deployment — runtime DB identity: DATABASE_URL_APP ONLY.
# Thirtieth-audit item 26: the pod receives no DATABASE_URL_ADMIN /
# DATABASE_URL_MIGRATOR / role passwords (no envFrom secretRef — every
# secret arrives as an explicit, named secretKeyRef below). The schema is
# applied by the db-migrate Job hook BEFORE this Deployment is rolled out;
# this pod never migrates (no init containers, dbAutoMigrate=false).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sensei.fullname" . }}-sensei-api
  labels:
    {{- include "sensei.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensei-api
spec:
  {{- if not .Values.autoscaling.senseiApi.enabled }}
  replicas: {{ .Values.senseiApi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sensei.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sensei-api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "sensei.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sensei-api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sensei.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: sensei-api
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 12 }}
        image: "{{ .Values.senseiApi.image.repository }}:{{ .Values.senseiApi.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.senseiApi.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # ConfigMap only via envFrom. NO envFrom secretRef: the secret also
        # carries the ADMIN/MIGRATOR URLs and role passwords, which must
        # never reach runtime pods — secrets are injected per-key below.
        envFrom:
        - configMapRef:
            name: {{ include "sensei.fullname" . }}-config
        env:
        - name: SENSEI_ENV
          value: {{ .Values.config.environment | quote }}
        # ── Runtime DB identity: APP only (never admin/migrator) ─────────
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: DATABASE_URL_APP
        - name: NATS_URL
          value: {{ include "sensei.nats.url" . | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: JWT_SECRET
        {{- if .Values.config.jwtPreviousSigningKey }}
        - name: JWT_PREVIOUS_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: JWT_PREVIOUS_SIGNING_KEY
              optional: true
        {{- end }}
        {{- if .Values.config.ceoPassword }}
        - name: SENSEI_CEO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: SENSEI_CEO_PASSWORD
              optional: true
        {{- end }}
        - name: S3_ENDPOINT
          value: {{ include "sensei.minio.endpoint" . | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: S3_SECRET_KEY
        - name: S3_BUCKET
          value: {{ .Values.config.storage.bucket | quote }}
        {{- if .Values.config.bootstrap.adminPassword }}
        - name: SENSEI_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: SENSEI_ADMIN_PASSWORD
              optional: true
        - name: SENSEI_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: SENSEI_ADMIN_EMAIL
              optional: true
        {{- end }}
        {{- if .Values.config.smtp.password }}
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: SMTP_PASSWORD
              optional: true
        {{- end }}
        {{- if .Values.config.erpStarz.apiKey }}
        - name: STARZ_ERP_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: STARZ_ERP_API_KEY
              optional: true
        {{- end }}
        {{- if .Values.config.erpStarz.webhookSecret }}
        - name: STARZ_ERP_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: STARZ_ERP_WEBHOOK_SECRET
              optional: true
        {{- end }}
        {{- if .Values.config.crmV2.apiKey }}
        - name: CRM_V2_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: CRM_V2_API_KEY
              optional: true
        {{- end }}
        {{- if .Values.config.crmV2.webhookSecret }}
        - name: CRM_V2_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: CRM_V2_WEBHOOK_SECRET
              optional: true
        {{- end }}
        - name: LOG_LEVEL
          value: {{ .Values.config.logLevel | quote }}
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8080"
        livenessProbe:
          {{- toYaml .Values.senseiApi.healthChecks.livenessProbe | nindent 12 }}
        readinessProbe:
          {{- toYaml .Values.senseiApi.healthChecks.readinessProbe | nindent 12 }}
        resources:
          {{- toYaml .Values.senseiApi.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
