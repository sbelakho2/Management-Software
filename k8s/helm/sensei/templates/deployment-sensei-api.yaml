{{- if .Values.senseiApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sensei.fullname" . }}-sensei-api
  labels:
    {{- include "sensei.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensei-api
spec:
  {{- if not .Values.autoscaling.senseiApi.enabled }}
  replicas: {{ .Values.senseiApi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sensei.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sensei-api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "sensei.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sensei-api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sensei.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: sensei-api
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 12 }}
        image: "{{ .Values.senseiApi.image.repository }}:{{ .Values.senseiApi.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.senseiApi.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "sensei.fullname" . }}-config
        - secretRef:
            name: {{ include "sensei.fullname" . }}-secret
            optional: true
        env:
        - name: SENSEI_ENV
          value: {{ .Values.config.environment | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: DATABASE_URL
        - name: NATS_URL
          value: {{ include "sensei.nats.url" . | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: JWT_SECRET
        - name: S3_ENDPOINT
          value: {{ include "sensei.minio.endpoint" . | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: S3_SECRET_KEY
        - name: S3_BUCKET
          value: {{ .Values.config.storage.bucket | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.config.logLevel | quote }}
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8080"
        livenessProbe:
          {{- toYaml .Values.senseiApi.healthChecks.livenessProbe | nindent 12 }}
        readinessProbe:
          {{- toYaml .Values.senseiApi.healthChecks.readinessProbe | nindent 12 }}
        resources:
          {{- toYaml .Values.senseiApi.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
