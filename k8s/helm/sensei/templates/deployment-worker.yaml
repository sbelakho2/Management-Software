{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sensei.fullname" . }}-worker
  labels:
    {{- include "sensei.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "sensei.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "sensei.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sensei.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: worker
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 12 }}
        image: "{{ .Values.senseiApi.image.repository }}:{{ .Values.senseiApi.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.senseiApi.image.pullPolicy }}
        command: ["/usr/local/bin/sensei-workers"]
        env:
        - name: SENSEI_ENV
          value: {{ .Values.config.environment | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: DATABASE_URL
        - name: NATS_URL
          value: "nats://{{ .Release.Name }}-nats:4222"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: JWT_SECRET
        - name: S3_ENDPOINT
          value: {{ include "sensei.minio.endpoint" . | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: S3_SECRET_KEY
        - name: S3_BUCKET
          value: {{ .Values.config.storage.bucket | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.config.logLevel | quote }}
        # Liveness probe — the worker's own --healthcheck verifies REAL
        # connectivity (DB + NATS), not process existence (no pgrep in the
        # runtime image).
        livenessProbe:
          exec:
            command:
            - sensei-workers
            - --healthcheck
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        # Readiness probe — DB + NATS must be reachable.
        readinessProbe:
          exec:
            command:
            - sensei-workers
            - --healthcheck
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources.worker | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
