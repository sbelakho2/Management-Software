{{- if .Values.worker.enabled }}
# =============================================================================
# worker Deployment — runtime DB identity: DATABASE_URL_APP ONLY.
# Thirtieth-audit item 26: same containment as the API — no envFrom
# secretRef, no DATABASE_URL_ADMIN / DATABASE_URL_MIGRATOR / role passwords.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sensei.fullname" . }}-worker
  labels:
    {{- include "sensei.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "sensei.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "sensei.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sensei.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: worker
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 12 }}
        image: "{{ .Values.senseiApi.image.repository }}:{{ .Values.senseiApi.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.senseiApi.image.pullPolicy }}
        command: ["/usr/local/bin/sensei-workers"]
        # ConfigMap only via envFrom. NO envFrom secretRef (the secret also
        # carries the ADMIN/MIGRATOR URLs and role passwords — runtime pods
        # get per-key refs below only).
        envFrom:
        - configMapRef:
            name: {{ include "sensei.fullname" . }}-config
        env:
        - name: SENSEI_ENV
          value: {{ .Values.config.environment | quote }}
        # ── Runtime DB identity: APP only (never admin/migrator) ─────────
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: DATABASE_URL_APP
        - name: NATS_URL
          value: {{ include "sensei.nats.url" . | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: JWT_SECRET
        {{- if .Values.config.jwtPreviousSigningKey }}
        - name: JWT_PREVIOUS_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: JWT_PREVIOUS_SIGNING_KEY
              optional: true
        {{- end }}
        - name: S3_ENDPOINT
          value: {{ include "sensei.minio.endpoint" . | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: S3_SECRET_KEY
        - name: S3_BUCKET
          value: {{ .Values.config.storage.bucket | quote }}
        {{- if .Values.config.smtp.password }}
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "sensei.fullname" . }}-secret
              key: SMTP_PASSWORD
              optional: true
        {{- end }}
        - name: LOG_LEVEL
          value: {{ .Values.config.logLevel | quote }}
        # Liveness: the runtime is alive. NEVER tests dependencies — a
        # PostgreSQL outage must not restart healthy workers (that only
        # adds load and noise); DB/NATS belong to readiness.
        livenessProbe:
          exec:
            command:
            - sensei-workers
            - --liveness
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness: can it currently process work? Real DB + NATS probes.
        readinessProbe:
          exec:
            command:
            - sensei-workers
            - --healthcheck
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources.worker | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
