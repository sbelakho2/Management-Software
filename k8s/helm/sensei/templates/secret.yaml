{{- if not .Values.externalSecrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sensei.fullname" . }}-secret
  labels:
    {{- include "sensei.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.config.secretKey | default (randAlphaNum 64) | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if .Values.redis.auth.enabled }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | default (randAlphaNum 32) | quote }}
  {{- end }}
  S3_ACCESS_KEY: {{ .Values.config.storage.accessKey | default (randAlphaNum 20) | quote }}
  S3_SECRET_KEY: {{ .Values.config.storage.secretKey | default (randAlphaNum 40) | quote }}
{{- end }}
