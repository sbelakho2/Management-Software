{{- if not .Values.externalSecrets.enabled -}}
{{- /*
  IMPORTANT: This template uses lookup to preserve existing secrets on upgrade.
  If the secret already exists, we reuse its values to prevent invalidating
  all JWTs and sessions on helm upgrade.
  
  For initial deployment, random values will be generated.
  For production, use externalSecrets.enabled=true or provide explicit values.
*/ -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "sensei.fullname" .))) -}}
{{- $secretKey := "" -}}
{{- $postgresPassword := "" -}}
{{- $redisPassword := "" -}}
{{- $s3AccessKey := "" -}}
{{- $s3SecretKey := "" -}}

{{- if $existingSecret }}
  {{- /* Reuse existing secrets to prevent session invalidation on upgrade */ -}}
  {{- $secretKey = index $existingSecret.data "SECRET_KEY" | default "" | b64dec -}}
  {{- $postgresPassword = index $existingSecret.data "POSTGRES_PASSWORD" | default "" | b64dec -}}
  {{- $redisPassword = index $existingSecret.data "REDIS_PASSWORD" | default "" | b64dec -}}
  {{- $s3AccessKey = index $existingSecret.data "S3_ACCESS_KEY" | default "" | b64dec -}}
  {{- $s3SecretKey = index $existingSecret.data "S3_SECRET_KEY" | default "" | b64dec -}}
{{- end }}

{{- /* Use provided values, existing values, or generate new ones */ -}}
{{- $secretKey = .Values.config.secretKey | default $secretKey | default (randAlphaNum 64) -}}
{{- $postgresPassword = .Values.postgresql.auth.password | default $postgresPassword | default (randAlphaNum 32) -}}
{{- $redisPassword = .Values.redis.auth.password | default $redisPassword | default (randAlphaNum 32) -}}
{{- $s3AccessKey = .Values.config.storage.accessKey | default $s3AccessKey | default (randAlphaNum 20) -}}
{{- $s3SecretKey = .Values.config.storage.secretKey | default $s3SecretKey | default (randAlphaNum 40) -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sensei.fullname" . }}-secret
  labels:
    {{- include "sensei.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  {{- end }}
  {{- if .Values.redis.auth.enabled }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  {{- end }}
  S3_ACCESS_KEY: {{ $s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3SecretKey | quote }}
{{- end }}
