{{- if not .Values.externalSecrets.enabled -}}
{{- /*
  SECRETS CONTRACT (thirtieth-audit item 26 — three-identity DB topology)
  ========================================================================
  This Secret is the ONLY place for credential-bearing values consumed by the
  Sensei services. There is NO universal DATABASE_URL anymore. The DB
  credential topology is:

    DATABASE_URL_ADMIN      bootstrap superuser (postgres / database.admin)
                            -> templates/job-db-bootstrap.yaml (pre-grants)
                            -> templates/job-db-grants.yaml    (post-migration)
    DATABASE_URL_MIGRATOR   deployment-only sensei_migrator
                            -> templates/job-db-migrate.yaml (--migrate-only)
    DATABASE_URL_APP        least-privilege sensei_app
                            -> API + worker Deployments ONLY

  Containment: the API/worker Deployment manifests reference ONLY
  DATABASE_URL_APP plus the non-DB secrets below (JWT, S3, SMTP, NATS, ...).
  They NEVER receive DATABASE_URL_ADMIN/MIGRATOR or the role passwords.
  SENSEI_APP_PASSWORD / SENSEI_MIGRATOR_PASSWORD are consumed exclusively by
  the bootstrap/grants Job hooks (the canonical role script
  sensei-rs/scripts/db/01-app-role.sh ALTERs the roles to those passwords,
  which is exactly what makes the generated URLs valid).

  Non-credential configuration lives in the ConfigMap (configmap.yaml):
    SENSEI_ENV, CORS_ALLOWED_ORIGINS, ports, NATS_URL, S3_ENDPOINT, S3_BUCKET,
    SMTP_HOST/PORT/USERNAME/FROM_*, log levels, feature flags, public URLs.

  Every deployment env var must reference the right source: Secret for
  secrets, ConfigMap for configuration. See .env.example (the canonical env
  contract) for the authoritative variable list.

  This template uses lookup to preserve existing values on upgrade, so
  rotating JWT/database secrets stays a deliberate act. For initial
  deployment, random role passwords are generated. For production, use
  externalSecrets.enabled=true or provide explicit values via --set.
*/ -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "sensei.fullname" .))) -}}
{{- $s3AccessKey := "" -}}
{{- $s3SecretKey := "" -}}
{{- $jwtSecret := "" -}}
{{- $appPassword := "" -}}
{{- $migratorPassword := "" -}}
{{- $erpStarzApiKey := "" -}}
{{- $crmV2ApiKey := "" -}}

{{- if $existingSecret }}
  {{- /* Reuse existing secrets to prevent session invalidation on upgrade */ -}}
  {{- $s3AccessKey = index $existingSecret.data "S3_ACCESS_KEY" | default "" | b64dec -}}
  {{- $s3SecretKey = index $existingSecret.data "S3_SECRET_KEY" | default "" | b64dec -}}
  {{- $jwtSecret = index $existingSecret.data "JWT_SECRET" | default "" | b64dec -}}
  {{- $appPassword = index $existingSecret.data "SENSEI_APP_PASSWORD" | default "" | b64dec -}}
  {{- $migratorPassword = index $existingSecret.data "SENSEI_MIGRATOR_PASSWORD" | default "" | b64dec -}}
  {{- $erpStarzApiKey = index $existingSecret.data "STARZ_ERP_API_KEY" | default "" | b64dec -}}
  {{- $crmV2ApiKey = index $existingSecret.data "CRM_V2_API_KEY" | default "" | b64dec -}}
{{- end }}

{{- /* Use provided values, existing values, or generate new ones */ -}}
{{- $s3AccessKey = .Values.config.storage.accessKey | default $s3AccessKey | default (randAlphaNum 20) -}}
{{- $s3SecretKey = .Values.config.storage.secretKey | default $s3SecretKey | default (randAlphaNum 40) -}}
{{- $jwtSecret = .Values.config.jwtSecret | default $jwtSecret | default (randAlphaNum 64) -}}
{{- $appPassword = .Values.database.app.password | default $appPassword | default (randAlphaNum 32) -}}
{{- $migratorPassword = .Values.database.migrator.password | default $migratorPassword | default (randAlphaNum 32) -}}
{{- $erpStarzApiKey = .Values.config.erpStarz.apiKey | default $erpStarzApiKey | default "" -}}
{{- $crmV2ApiKey = .Values.config.crmV2.apiKey | default $crmV2ApiKey | default "" -}}

{{- /* ── DB identity URL construction ────────────────────────────────────
     Bundled Bitnami (postgresql.enabled): admin = postgres superuser with
     postgresql.auth.postgresPassword; roles are provisioned by the hooks.
     External/managed DB: database.{host,admin.user,admin.password}. Full
     URL overrides (database.{admin,migrator,app}.url) win verbatim — the
     shape used with managed DBs and the externalSecrets contract. */ -}}
{{- $dbHost := include "sensei.db.host" . -}}
{{- $dbPort := .Values.database.port | default "5432" -}}
{{- $dbName := .Values.database.name | default "sensei" -}}
{{- $adminUser := .Values.database.admin.user | default "postgres" -}}
{{- $adminPassword := .Values.database.admin.password | default "" -}}
{{- if .Values.postgresql.enabled -}}
{{-   $adminUser = "postgres" -}}
{{-   $adminPassword = .Values.postgresql.auth.postgresPassword | default "" -}}
{{- end -}}
{{- $adminUrl := printf "postgres://%s:%s@%s:%s/%s" $adminUser $adminPassword $dbHost $dbPort $dbName -}}
{{- $migratorUrl := printf "postgres://%s:%s@%s:%s/%s" .Values.database.migrator.user $migratorPassword $dbHost $dbPort $dbName -}}
{{- $appUrl := printf "postgres://%s:%s@%s:%s/%s" .Values.database.app.user $appPassword $dbHost $dbPort $dbName -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sensei.fullname" . }}-secret
  labels:
    {{- include "sensei.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # ── Three DB identities (thirtieth-audit item 26) ──────────────────────
  # ADMIN: bootstrap/grants Job hooks only — never mounted into API/worker.
  DATABASE_URL_ADMIN: {{ .Values.database.admin.url | default $adminUrl | quote }}
  # MIGRATOR: db-migrate Job hook only (sensei-api --migrate-only).
  DATABASE_URL_MIGRATOR: {{ .Values.database.migrator.url | default $migratorUrl | quote }}
  # APP: the ONLY DB URL the runtime API + workers receive (as DATABASE_URL).
  DATABASE_URL_APP: {{ .Values.database.app.url | default $appUrl | quote }}
  # Role passwords the canonical role script (sensei-rs/scripts/db/01-app-
  # role.sh) converges via ALTER ROLE — bootstrap/grants Job hooks only.
  SENSEI_APP_PASSWORD: {{ $appPassword | quote }}
  SENSEI_MIGRATOR_PASSWORD: {{ $migratorPassword | quote }}
  # ── Runtime secrets (API + workers) ─────────────────────────────────────
  # Rust API: JWT signing secret
  JWT_SECRET: {{ $jwtSecret | quote }}
  {{- if .Values.config.jwtPreviousSigningKey }}
  # Rust API: previous JWT signing key (rotation window only)
  JWT_PREVIOUS_SIGNING_KEY: {{ .Values.config.jwtPreviousSigningKey | quote }}
  {{- end }}
  {{- if .Values.config.ceoPassword }}
  # Rust API: password for the seeded CEO account (no default — set explicitly)
  SENSEI_CEO_PASSWORD: {{ .Values.config.ceoPassword | quote }}
  {{- end }}
  # Rust API: S3/MinIO credentials
  S3_ACCESS_KEY: {{ $s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3SecretKey | quote }}
  {{- if .Values.config.bootstrap.adminPassword }}
  # Bootstrap admin identity (required by the API at startup)
  SENSEI_ADMIN_PASSWORD: {{ .Values.config.bootstrap.adminPassword | quote }}
  SENSEI_ADMIN_EMAIL: {{ .Values.config.bootstrap.adminEmail | quote }}
  {{- end }}
  {{- if .Values.config.smtp.password }}
  # SMTP password for email delivery
  SMTP_PASSWORD: {{ .Values.config.smtp.password | quote }}
  {{- end }}
  {{- if and .Values.nats.auth.enabled .Values.nats.auth.user }}
  # NATS authentication (only when NATS auth is enabled)
  NATS_USER: {{ .Values.nats.auth.user | quote }}
  {{- end }}
  {{- if and .Values.nats.auth.enabled .Values.nats.auth.password }}
  NATS_PASSWORD: {{ .Values.nats.auth.password | quote }}
  {{- end }}
  # Tri-system integration API keys (stored in secrets, not configmap)
  {{- if $erpStarzApiKey }}
  STARZ_ERP_API_KEY: {{ $erpStarzApiKey | quote }}
  {{- end }}
  {{- if .Values.config.erpStarz.webhookSecret }}
  STARZ_ERP_WEBHOOK_SECRET: {{ .Values.config.erpStarz.webhookSecret | quote }}
  {{- end }}
  {{- if $crmV2ApiKey }}
  CRM_V2_API_KEY: {{ $crmV2ApiKey | quote }}
  {{- end }}
  {{- if .Values.config.crmV2.webhookSecret }}
  CRM_V2_WEBHOOK_SECRET: {{ .Values.config.crmV2.webhookSecret | quote }}
  {{- end }}
{{- end }}
