{{- /*
  HorizontalPodAutoscaler for the Rust sensei-api deployment.
  NOTE: the previous Python-era backend/frontend HPA blocks targeted
  deployments that no longer exist and broke `helm template` (they referenced
  .Values.autoscaling.backend/.frontend, removed from values.yaml). Replaced
  with the current component's HPA.
*/ -}}
{{- if .Values.autoscaling.senseiApi.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sensei.fullname" . }}-sensei-api
  labels:
    {{- include "sensei.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensei-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sensei.fullname" . }}-sensei-api
  minReplicas: {{ .Values.autoscaling.senseiApi.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.senseiApi.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.senseiApi.targetCPUUtilizationPercentage }}
{{- end }}
