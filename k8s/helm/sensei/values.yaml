# Default values for Sensei OS
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Replica counts
replicaCount:
  senseiApi: 2
  worker: 1

# Service configuration
service:
  senseiApi:
    type: ClusterIP
    port: 8080
    targetPort: 8080

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: sensei.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: sensei-api
        - path: /
          pathType: Prefix
          backend: sensei-api
  tls:
    - secretName: sensei-tls
      hosts:
        - sensei.example.com

# Application configuration
config:
  environment: production
  debug: false
  logLevel: info
  # JWT signing secret — leave empty to auto-generate on first install
  # (or set it explicitly; it is stored in the Secret, not the ConfigMap)
  jwtSecret: ""
  # Previous JWT signing key, only used during key-rotation windows.
  # Leave empty when no rotation is in progress.
  jwtPreviousSigningKey: ""
  # Password for the seeded CEO account — NO default; set explicitly for
  # production (stored in the Secret). A placeholder/weak value is rejected
  # by the API at startup in production.
  ceoPassword: ""
  bootstrap:
    # Bootstrap admin identity. The API refuses to start in production
    # without SENSEI_ADMIN_PASSWORD; supply it here (or via the
    # external-secret contract) so a fresh deployment can become ready.
    adminEmail: "admin@sensei.local"
    adminPassword: ""
  smtp:
    password: ""
  # Rust runtime tunables (non-secret; surfaced via the ConfigMap)
  rust:
    accessTokenTtlMinutes: 15
    refreshTokenExpiryDays: 7
    jwtIssuer: sensei
    jwtAudience: sensei-api
    dbMaxConnections: 20
    dbConnectionTimeout: 30
    # DB auto-migration is a DEV/legacy opt-in ONLY. Production topology
    # (thirtieth-audit item 26): the schema is applied exclusively by the
    # dedicated migration Job (templates/job-db-migrate.yaml) running as the
    # deployment-only sensei_migrator identity BEFORE the API/worker rollout;
    # the API itself NEVER migrates (no init containers, no startup DDL).
    # A failed migration hook aborts the release and the previous deployment
    # keeps serving traffic.
    dbAutoMigrate: false
    apiHost: 0.0.0.0
    apiPort: 8080
    metricsPort: 9090
    securityHsts: true
    trustedProxies: ""
    realtimeTicketTtlSeconds: 300
    idempotencyTtlSeconds: 300
  natsCluster: sensei
  # Sentry DSN for error tracking
  sentryDsn: ""
  # SMTP configuration for email notifications
  smtp:
    host: ""
    port: 587
    user: ""
    password: ""  # Secret — stored in the Secret, not the ConfigMap
    fromEmail: "noreply@sensei.local"
    fromName: "Sensei OS"
  # CORS allowed origins — consumed by the Rust API as CORS_ALLOWED_ORIGINS
  corsOrigins:
    - https://sensei.example.com
    - https://erp.starz.example.com
    - https://crm-v2.example.com
  # Feature flags
  features:
    aiEnabled: false
    websocketEnabled: true
    auditLogging: true
    rateLimiting: true
    phase2Npi: true
    phase3Production: false
    smartIngestion: true
    knowledgePack: true
    enableMl: true
    enableWebsockets: true
    enableBackgroundJobs: true
  # S3/MinIO configuration
  storage:
    endpoint: http://minio:9000
    bucket: sensei-attachments
    region: us-east-1
    backend: s3
    accessKey: ""
    secretKey: ""
  # ==================================================================
  # Tri-System Integration (erpStarz + CRM-v2)
  # ==================================================================
  erpStarz:
    apiUrl: ""        # e.g. https://erp.starz.example.com/api
    apiKey: ""        # Secret — set via externalSecrets or --set
    webhookSecret: "" # Secret — set via externalSecrets or --set
    databaseUrl: ""   # e.g. postgresql://user:pass@erp-db:5432/erpstarz
  crmV2:
    apiUrl: ""        # e.g. https://crm-v2.example.com/api
    apiKey: ""        # Secret — set via externalSecrets or --set
    webhookSecret: "" # Secret — set via externalSecrets or --set
    databaseUrl: ""   # e.g. postgresql://user:pass@crm-db:5432/crmv2

# NATS JetStream configuration
nats:
  enabled: true
  cluster:
    # HA production: 3 replicas with file-backed JetStream. Queue work
    # (emails, PDFs, ML, scheduled analytics) must survive broker restarts.
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    memoryStorage:
      enabled: false
    fileStorage:
      enabled: true
      size: 10Gi
  auth:
    # Production requires authenticated NATS: the chart FAILS to render
    # when auth is enabled with an empty password (set the password or
    # deliberately allow an unauthenticated broker for non-production).
    enabled: true
    user: "sensei"
    # The password is the single NATS credential used by BOTH the broker
    # subchart and the application's NATS_URL. Replace it before deploying.
    password: "REPLACE_WITH_STRONG_NATS_PASSWORD"
    allowUnauthenticated: false


senseiApi:
  enabled: true
  replicaCount: 2
  image:
    repository: sensei-api
    # Tag defaults to Chart.appVersion if empty - set explicitly for version pinning
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  healthChecks:
    livenessProbe:
      httpGet:
        path: /health/live
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

# External Secrets Operator integration
# Maps remote vault properties onto the app Secret. The keys below mirror the
# full credential contract defined in templates/secret.yaml.
#
# DB identities are SEPARATE vault secrets (thirtieth-audit item 26): the
# admin/migrator URLs are never mounted into API/worker pods, so the vault
# layout keeps the same containment the runtime enforces.
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreName: "vault-backend"
  secretStoreKind: "ClusterSecretStore"
  data:
    # Runtime app identity — the ONLY DB URL the API/worker pods receive.
    DATABASE_URL_APP:
      remoteKey: "sensei/prod/db/app"
      remoteProperty: "url"
    # Deployment-only migration identity (db-migrate Job hook only).
    DATABASE_URL_MIGRATOR:
      remoteKey: "sensei/prod/db/migrator"
      remoteProperty: "url"
    # Bootstrap superuser identity (db-bootstrap/db-grants Job hooks only).
    DATABASE_URL_ADMIN:
      remoteKey: "sensei/prod/db/admin"
      remoteProperty: "url"
    # Role passwords the canonical bootstrap/grants script converges
    # (ALTER ROLE ... PASSWORD) — consumed by the bootstrap/grant hooks only.
    SENSEI_APP_PASSWORD:
      remoteKey: "sensei/prod/db/app"
      remoteProperty: "password"
    SENSEI_MIGRATOR_PASSWORD:
      remoteKey: "sensei/prod/db/migrator"
      remoteProperty: "password"
    JWT_SECRET:
      remoteKey: "sensei/prod/auth"
      remoteProperty: "jwt_secret"
    JWT_PREVIOUS_SIGNING_KEY:
      remoteKey: "sensei/prod/auth"
      remoteProperty: "jwt_previous_signing_key"
    SENSEI_CEO_PASSWORD:
      remoteKey: "sensei/prod/auth"
      remoteProperty: "ceo_password"
    S3_ACCESS_KEY:
      remoteKey: "sensei/prod/storage"
      remoteProperty: "access_key"
    S3_SECRET_KEY:
      remoteKey: "sensei/prod/storage"
      remoteProperty: "secret_key"
    SMTP_PASSWORD:
      remoteKey: "sensei/prod/smtp"
      remoteProperty: "password"
    NATS_USER:
      remoteKey: "sensei/prod/nats"
      remoteProperty: "user"
    NATS_PASSWORD:
      remoteKey: "sensei/prod/nats"
      remoteProperty: "password"

# Resource limits
resources:
  senseiApi:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  worker:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Autoscaling
autoscaling:
  senseiApi:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Redis configuration (Bitnami chart)
# The credential-bearing REDIS_URL for the app is assembled in the Secret
# (templates/secret.yaml) from redis.auth when enabled.
redis:
  enabled: false
  auth:
    enabled: false
    password: ""  # Secret — stored in the app Secret (REDIS_URL), not the ConfigMap

# =============================================================================
# DATABASE CAPABILITY CONTRACT + IDENTITY TOPOLOGY (thirtieth-audit items
# 26 and 28)
#
# The chart ships the PRODUCTION DB topology: THREE identities, exactly like
# the Compose/DB-contract path:
#   DATABASE_URL_ADMIN      bootstrap superuser — db-bootstrap + db-grants
#                           Job hooks only (run the canonical role script
#                           sensei-rs/scripts/db/01-app-role.sh, shipped in
#                           the application image)
#   DATABASE_URL_MIGRATOR   deployment-only sensei_migrator — db-migrate Job
#                           hook only (sensei-api --migrate-only)
#   DATABASE_URL_APP        least-privilege sensei_app — API + workers only
# API/worker manifests NEVER contain the admin or migrator URLs.
#
# Database product: the pinned capability image from .github/.db-capability
# (pgvector/pgvector:pg16@sha256:<pinned digest> — PostgreSQL 16 WITH the
# vector extension migration 004 requires; plain postgres:16 or the Bitnami
# image CANNOT satisfy it). The PostgreSQL server itself is provisioned
# OUTSIDE this chart (managed/external, or your own StatefulSet running the
# pinned image); the bootstrap/migrate/grants hooks provision roles+grants
# against it on install and before every upgrade.
# =============================================================================
database:
  # Pinned capability image (single literal consumed by the DB contract —
  # .github/.db-capability is the source; scripts/validate-db-contract.sh
  # enforces that workflows, compose files and this value stay identical).
  imagePin: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
  # External DB endpoint (required when postgresql.enabled=false — the
  # default). E.g. the service name of your pgvector-family PostgreSQL.
  host: ""
  port: "5432"
  name: sensei
  admin:
    # Bootstrap superuser identity (db-bootstrap/db-grants hooks).
    user: postgres
    password: ""          # Secret — set via values/--set or externalSecrets
    url: ""               # Full DATABASE_URL_ADMIN override (managed DB)
  migrator:
    # Deployment-only migration identity (db-migrate hook). The role is
    # CREATED by the bootstrap hook with the password below, so the chart
    # may generate it (preserved across upgrades via the Secret lookup).
    user: sensei_migrator
    password: ""          # Empty => generated + preserved (or externalSecrets)
    url: ""               # Full DATABASE_URL_MIGRATOR override
  app:
    # Least-privilege runtime identity (API + workers). Created by the
    # bootstrap hook with the password below.
    user: sensei_app
    password: ""          # Empty => generated + preserved (or externalSecrets)
    url: ""               # Full DATABASE_URL_APP override
  jobs:
    # The bootstrap -> migrate -> grants Job hooks (pre-install/pre-upgrade,
    # hook weights -5/-3/-1) gate every rollout. A failed hook aborts the
    # release; on upgrade the previous deployment keeps serving traffic.
    enabled: true

# PostgreSQL configuration (Bitnami subchart) — DEV/EVAL CONVENIENCE ONLY.
# The Bitnami PostgreSQL image cannot satisfy the DB capability contract
# (no pgvector; migration 004 requires CREATE EXTENSION vector) and its
# first-ever install cannot feed the pre-install DB hooks (the subchart is
# created after hooks run). Production (the default: postgresql.enabled:
# false) provisions the pinned pgvector-family DB externally and lets the
# bootstrap/migrate/grants hooks own the schema lifecycle. Enabling the
# subchart here is for local/eval stacks where you accept manual DB
# provisioning — the API role topology still applies.
postgresql:
  enabled: false
  auth:
    username: sensei
    password: ""            # Deprecated in the new topology (was the old
                            # shared-app-user credential)
    database: sensei
    # Superuser password (the ADMIN identity when the subchart is enabled):
    # REQUIRED for the bootstrap/migrate/grants hooks to run against the
    # bundled DB (they connect as `postgres`). No default — set explicitly.
    postgresPassword: ""
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    initdb:
      # Dev/eval only: on a FRESH bundled Bitnami volume these run at first
      # boot. NOTE: `vector` fails on the Bitnami image (it is not the
      # pgvector product) — this block documents the dev intent; production
      # DB provisioning happens against the pinned capability image.
      scripts:
        init.sql: |
          -- Enable required extensions
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
      storage:
        size: 10Gi

# MinIO (S3-compatible storage)
minio:
  enabled: true
  mode: standalone
  replicas: 1
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  buckets:
    - name: sensei-attachments
      policy: none
      purge: false
  users:
    - accessKey: sensei
      secretKey: ""  # Set via secrets
      policy: readwrite

# Worker configuration (Rust NATS workers)
worker:
  enabled: true
  replicas: 1
  command:
    - "./sensei-workers"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Persistence
persistence:
  uploads:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteMany

# Security
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Network policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  # CIDR blocks for external system egress restrictions
  # These restrict egress to only the specific erpStarz/CRM-v2 IP ranges
  erpStarzCIDR: ""   # e.g. "203.0.113.0/24"
  crmV2CIDR: ""      # e.g. "198.51.100.0/24"

# Service accounts
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# Monitoring
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
  grafana:
    enabled: false
  prometheus:
    enabled: false

# Logging
logging:
  enabled: true
  format: json
  level: info

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30
  storage:
    type: s3
    bucket: sensei-backups
    region: us-east-1

# Node affinity
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - sensei
          topologyKey: kubernetes.io/hostname
