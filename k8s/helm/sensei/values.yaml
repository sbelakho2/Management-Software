# Default values for Sensei OS
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Replica counts
replicaCount:
  senseiApi: 2
  worker: 1

# Service configuration
service:
  senseiApi:
    type: ClusterIP
    port: 8080
    targetPort: 8080

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: sensei.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: sensei-api
        - path: /
          pathType: Prefix
          backend: sensei-api
  tls:
    - secretName: sensei-tls
      hosts:
        - sensei.example.com

# Application configuration
config:
  environment: production
  debug: false
  logLevel: info
  # Secret key - should be set via secrets
  secretKey: ""
  # Database URL - constructed from postgresql values
  databaseUrl: ""
  # Sentry DSN for error tracking
  sentryDsn: ""
  # SMTP configuration for email notifications
  smtp:
    host: ""
    port: 587
    user: ""
    password: ""  # Secret — set via externalSecrets or --set
    fromEmail: "noreply@sensei.local"
    fromName: "Sensei OS"
  # CORS origins — includes cross-system origins for tri-system integration
  corsOrigins:
    - https://sensei.example.com
    - https://erp.starz.example.com
    - https://crm-v2.example.com
  # Feature flags
  features:
    phase2Npi: true
    phase3Production: false
    smartIngestion: true
    knowledgePack: true
    enableMl: true
    enableWebsockets: true
    enableBackgroundJobs: true
  # S3/MinIO configuration
  storage:
    endpoint: http://minio:9000
    bucket: sensei-attachments
    accessKey: ""
    secretKey: ""
  # ==================================================================
  # Tri-System Integration (erpStarz + CRM-v2)
  # ==================================================================
  erpStarz:
    apiUrl: ""        # e.g. https://erp.starz.example.com/api
    apiKey: ""        # Secret — set via externalSecrets or --set
    webhookSecret: "" # Secret — set via externalSecrets or --set
    databaseUrl: ""   # e.g. postgresql://user:pass@erp-db:5432/erpstarz
  crmV2:
    apiUrl: ""        # e.g. https://crm-v2.example.com/api
    apiKey: ""        # Secret — set via externalSecrets or --set
    webhookSecret: "" # Secret — set via externalSecrets or --set
    databaseUrl: ""   # e.g. postgresql://user:pass@crm-db:5432/crmv2

# NATS JetStream configuration
nats:
  enabled: true
  cluster:
    enabled: false  # Single node for now
  jetstream:
    enabled: true
    memoryStorage:
      enabled: true
      size: 1Gi
    fileStorage:
      enabled: false
  auth:
    enabled: false  # Will use NATS token auth later

# Rust Axum API (sensei-rs) configuration
senseiApi:
  enabled: true
  replicaCount: 2
  image:
    repository: sensei-api
    # Tag defaults to Chart.appVersion if empty - set explicitly for version pinning
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  healthChecks:
    livenessProbe:
      httpGet:
        path: /api/v1/health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /api/v1/health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

# External Secrets Operator integration
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreName: "vault-backend"
  secretStoreKind: "ClusterSecretStore"
  data:
    SECRET_KEY:
      remoteKey: "sensei/prod/secrets"
      remoteProperty: "SECRET_KEY"
    POSTGRES_PASSWORD:
      remoteKey: "sensei/prod/db"
      remoteProperty: "password"
    S3_ACCESS_KEY:
      remoteKey: "sensei/prod/storage"
      remoteProperty: "access_key"
    S3_SECRET_KEY:
      remoteKey: "sensei/prod/storage"
      remoteProperty: "secret_key"

# Resource limits
resources:
  senseiApi:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  worker:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Autoscaling
autoscaling:
  senseiApi:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Health checks
healthChecks:
  senseiApi:
    livenessProbe:
      httpGet:
        path: /api/v1/health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /api/v1/health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  worker:
    livenessProbe:
      exec:
        command:
          - pgrep
          - -f
          - sensei-workers
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      exec:
        command:
          - pgrep
          - -f
          - sensei-workers
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 3

# PostgreSQL configuration (Bitnami chart)
postgresql:
  enabled: true
  auth:
    username: sensei
    password: ""  # Set via secrets
    database: sensei
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    initdb:
      scripts:
        init.sql: |
          -- Enable required extensions
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "vector";
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
      storage:
        size: 10Gi

# MinIO (S3-compatible storage)
minio:
  enabled: true
  mode: standalone
  replicas: 1
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  buckets:
    - name: sensei-attachments
      policy: none
      purge: false
  users:
    - accessKey: sensei
      secretKey: ""  # Set via secrets
      policy: readwrite

# Worker configuration (Rust NATS workers)
worker:
  enabled: true
  replicas: 1
  command:
    - "./sensei-workers"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Persistence
persistence:
  uploads:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteMany

# Security
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Network policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  # CIDR blocks for external system egress restrictions
  # These restrict egress to only the specific erpStarz/CRM-v2 IP ranges
  erpStarzCIDR: ""   # e.g. "203.0.113.0/24"
  crmV2CIDR: ""      # e.g. "198.51.100.0/24"

# Service accounts
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# Monitoring
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
  grafana:
    enabled: false
  prometheus:
    enabled: false

# Logging
logging:
  enabled: true
  format: json
  level: info

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30
  storage:
    type: s3
    bucket: sensei-backups
    region: us-east-1

# Node affinity
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - sensei
          topologyKey: kubernetes.io/hostname
