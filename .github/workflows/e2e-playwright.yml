name: e2e-playwright

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      # Thirtieth-audit item 27/28: the E2E gate must exercise the REAL
      # schema dependency — migration 004 requires CREATE EXTENSION vector,
      # which plain postgres:16 cannot satisfy. The image is the pinned DB
      # capability image from .github/.db-capability (same literal as the
      # db-contract workflow; scripts/validate-db-contract.sh enforces it).
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sensei_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sensei_test
      JWT_SECRET: ci-e2e-secret
      SENSEI_ENV: test
      SENSEI_NO_ZIG: "1"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      # Thirtieth-audit item 27: Trunk is pinned in .github/.tool-versions
      # (`trunk <version>` — same manifest the Dockerfile frontend stage
      # mirrors) and installed with `--version "$TRUNK_VERSION" --locked`,
      # never "latest" via the jetli action.
      - name: Install trunk (pinned from .github/.tool-versions)
        run: |
          set -euo pipefail
          TRUNK_VERSION="$(awk '$1=="trunk"{print $2}' .github/.tool-versions)"
          [ -n "$TRUNK_VERSION" ] || { echo "no trunk pin in .github/.tool-versions" >&2; exit 1; }
          cargo install trunk --version "$TRUNK_VERSION" --locked

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build frontend (trunk — the REAL bundle the router serves)
        working-directory: sensei-rs/crates/sensei-frontend
        run: |
          # Trunk config (Trunk.toml) also carries the flags; the explicit
          # wasm-opt pass below is the DETERMINISTIC enforcement: the
          # generated module uses bulk-memory + atomic instructions, so the
          # optimizer must run feature-consistent with the module
          # (twenty-third audit: do not suppress optimization — enable the
          # exact features the module needs).
          # Twenty-fourth audit P0: index.html now carries
          # data-wasm-opt="0" on the rust asset, so trunk's automatic
          # per-asset wasm-opt pass (which runs with a conservative feature
          # set and rejects these instructions) can no longer fail the
          # build BEFORE the post-pass below runs.
          trunk build --release
          for wasm in dist/*.wasm; do
            wasm-opt --enable-bulk-memory --enable-threads --enable-sign-ext -O3 "$wasm" -o "$wasm"
          done
          cp -r dist ../../dist-frontend

      # Twenty-eighth audit P0 (release gate): SENSEI_NO_ZIG is set ONCE
      # at the job level (above) — every cargo invocation in this job
      # (frontend trunk build, API build, the migrations+seed step, the
      # API boot) relies on the pure-Rust path, and a step-scoped env var
      # silently missed the 'Run migrations + seed' recompile.
      - name: Build API
        working-directory: sensei-rs
        run: cargo build -p sensei-api --release

      - name: Run migrations + seed
        working-directory: sensei-rs
        run: |
          DATABASE_URL_TEST=$DATABASE_URL cargo test -p sensei-db --test db_contract every_tenant
          cargo run -p sensei-api --release --bin sensei-api -- --migrate-only

      - name: Start API + frontend
        working-directory: sensei-rs
        run: |
          cargo run -p sensei-api --release &
          python3 -m http.server 8080 -d dist-frontend &
          # Item 79: the API exposes /livez and /readyz (NOT /healthz).
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/livez > /dev/null \
               && curl -sf http://127.0.0.1:8081/readyz > /dev/null; then
              echo "API ready"; break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null || (echo "frontend not serving"; exit 1)

      - name: Install Playwright
        run: |
          cd sensei-rs/e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E + axe
        run: |
          cd sensei-rs/e2e
          E2E_ADMIN_EMAIL=admin@sensei.local \
          E2E_ADMIN_PASSWORD=Test@1234 \
          npx playwright test --reporter=line
