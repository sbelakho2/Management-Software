name: e2e-playwright

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      # Thirtieth-audit item 27/28: the E2E gate must exercise the REAL
      # schema dependency — migration 004 requires CREATE EXTENSION vector,
      # which plain postgres:16 cannot satisfy. The image is the pinned DB
      # capability image from .github/.db-capability (same literal as the
      # db-contract workflow; scripts/validate-db-contract.sh enforces it).
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sensei_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sensei_test
      JWT_SECRET: ci-e2e-secret
      SENSEI_ENV: test
      SENSEI_NO_ZIG: "1"
      # The suite performs bursty realtime/snapshot polling; throttling is
      # validated by unit tests, not here.
      FEATURE_RATE_LIMITING: "false"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      # Thirtieth-audit item 27: Trunk is pinned in .github/.tool-versions
      # (`trunk <version>` — same manifest the Dockerfile frontend stage
      # mirrors) and installed with `--version "$TRUNK_VERSION" --locked`,
      # never "latest" via the jetli action.
      - name: Install trunk (pinned from .github/.tool-versions)
        run: |
          set -euo pipefail
          TRUNK_VERSION="$(awk '$1=="trunk"{print $2}' .github/.tool-versions)"
          [ -n "$TRUNK_VERSION" ] || { echo "no trunk pin in .github/.tool-versions" >&2; exit 1; }
          cargo install trunk --version "$TRUNK_VERSION" --locked

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build frontend (trunk — the REAL bundle the router serves)
        working-directory: sensei-rs/crates/sensei-frontend
        run: |
          # Trunk config (Trunk.toml) also carries the flags; the explicit
          # wasm-opt pass below is the DETERMINISTIC enforcement: the
          # generated module uses bulk-memory + atomic instructions, so the
          # optimizer must run feature-consistent with the module
          # (twenty-third audit: do not suppress optimization — enable the
          # exact features the module needs).
          # Twenty-fourth audit P0: index.html now carries
          # data-wasm-opt="0" on the rust asset, so trunk's automatic
          # per-asset wasm-opt pass (which runs with a conservative feature
          # set and rejects these instructions) can no longer fail the
          # build BEFORE the post-pass below runs.
          trunk build --release
          for wasm in dist/*.wasm; do
            # Feature-complete validator set: wasm-bindgen's current glue
            # emits reference-types (externref) and may use sign-ext /
            # bulk-memory / threads; missing flags make the validator
            # reject used features ("all used features should be allowed").
            wasm-opt --enable-bulk-memory --enable-threads --enable-sign-ext \
              --enable-reference-types --enable-nontrapping-float-to-int \
              -O3 "$wasm" -o "$wasm"
          done
          cp -r dist ../../dist-frontend

      # Twenty-eighth audit P0 (release gate): SENSEI_NO_ZIG is set ONCE
      # at the job level (above) — every cargo invocation in this job
      # (frontend trunk build, API build, the migrations+seed step, the
      # API boot) relies on the pure-Rust path, and a step-scoped env var
      # silently missed the 'Run migrations + seed' recompile.
      - name: Build API
        working-directory: sensei-rs
        run: cargo build -p sensei-api --release

      - name: Run migrations + seed
        working-directory: sensei-rs
        run: |
          DATABASE_URL_TEST=$DATABASE_URL cargo test -p sensei-db --test db_contract every_tenant
          cargo run -p sensei-api --release --bin sensei-api -- --migrate-only

      - name: Start API + frontend (single origin)
        working-directory: sensei-rs
        run: |
          # ONE process serves the bundle AND /api/v1 (the router's static
          # + SPA fallback): the frontend's API calls are same-origin
          # relative paths, so a separate python static server could never
          # work (no SPA deep-link fallback, no /api proxy, CORS).
          API_PORT=8081 \
          SENSEI_ADMIN_PASSWORD='Test@1234' \
          SENSEI_CEO_PASSWORD='Test@1234' \
          cargo run -p sensei-api --release &
          # Item 79: the API exposes /livez and /readyz (NOT /healthz).
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/livez > /dev/null \
               && curl -sf http://127.0.0.1:8081/readyz > /dev/null; then
              echo "API ready"; break
            fi
            sleep 2
          done
          # The SPA entry point must answer client routes, not 404.
          curl -sf http://127.0.0.1:8081/ | grep -q "Starz Forge" \
            || { echo "frontend bundle not serving"; exit 1; }
          curl -sf http://127.0.0.1:8081/login | grep -q "Starz Forge" \
            || { echo "SPA deep-link fallback broken"; exit 1; }

      - name: Seed e2e topology + operator grants
        run: |
          # The station/team-lead flows need a REAL principal context: a
          # site + work center + employee assignment for the E2E user and a
          # custom role granting ops:/tps: (the platform_admin static map
          # covers tenants/users/system only). Seed AFTER the API boot
          # (account seeding happens at startup).
          PGPASSWORD=postgres psql -h localhost -U postgres -d sensei_test <<'SQL'
          INSERT INTO sites (id, tenant_id, name, site_code, timezone) VALUES
            ('11111111-1111-4111-8111-111111111111','00000000-0000-0000-0000-000000000001','E2E Site','E2E','UTC')
            ON CONFLICT (id) DO NOTHING;
          INSERT INTO work_centers (id, tenant_id, site_id, work_center_number, name) VALUES
            ('22222222-2222-4222-8222-222222222222','00000000-0000-0000-0000-000000000001','11111111-1111-4111-8111-111111111111','E2E-WC-01','E2E Work Center')
            ON CONFLICT (id) DO NOTHING;
          UPDATE users SET site_id = '11111111-1111-4111-8111-111111111111'
            WHERE tenant_id = '00000000-0000-0000-0000-000000000001' AND email = 'ceo@starz.com';
          INSERT INTO employee_assignments (tenant_id, user_id, site_id, work_center_id, is_active)
            SELECT tenant_id, id, '11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222', TRUE
            FROM users WHERE tenant_id = '00000000-0000-0000-0000-000000000001' AND email = 'ceo@starz.com'
            ON CONFLICT DO NOTHING;
          INSERT INTO roles (id, tenant_id, name, description, permissions)
          VALUES ('33333333-3333-4333-8333-333333333333','00000000-0000-0000-0000-000000000001','e2e_ops','E2E operator/team-lead permissions', ARRAY['ops:*','tps:*'])
          ON CONFLICT (tenant_id, name) DO NOTHING;
          INSERT INTO role_slots (id, tenant_id, role_name, slot_name, scope_kind, description)
          VALUES ('44444444-4444-4444-8444-444444444444','00000000-0000-0000-0000-000000000001','e2e_ops','e2e_ops_all','tenant','E2E full ops/tps grant')
          ON CONFLICT (tenant_id, slot_name) DO NOTHING;
          INSERT INTO principal_assignments (tenant_id, principal_id, slot_id)
          SELECT '00000000-0000-0000-0000-000000000001', u.id, '44444444-4444-4444-8444-444444444444'
          FROM users u WHERE u.tenant_id='00000000-0000-0000-0000-000000000001' AND u.email='ceo@starz.com'
          ON CONFLICT DO NOTHING;
          SQL

      - name: Install Playwright
        run: |
          cd sensei-rs/e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E + axe
        run: |
          # Config lives at sensei-rs/playwright.config.js (baseURL etc.) —
          # Playwright only discovers it from the working directory, so run
          # from sensei-rs, not from e2e/.
          cd sensei-rs
          E2E_BASE_URL=http://localhost:8081 \
          E2E_ADMIN_EMAIL=ceo@starz.com \
          E2E_ADMIN_PASSWORD=Test@1234 \
          npx playwright test --reporter=line
