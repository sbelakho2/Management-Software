name: e2e-playwright

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      # Thirtieth-audit item 27/28: the E2E gate must exercise the REAL
      # schema dependency — migration 004 requires CREATE EXTENSION vector,
      # which plain postgres:16 cannot satisfy. The image is the pinned DB
      # capability image from .github/.db-capability (same literal as the
      # db-contract workflow; scripts/validate-db-contract.sh enforces it).
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sensei_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Thirtieth-first audit item 17: DATABASE_URL is the SUPERUSER
      # bootstrap channel — it drives the migration/seed steps ONLY. The
      # API process itself boots with the least-privilege sensei_app
      # connection (see the Start API step), so the E2E suite exercises
      # the REAL production role: FORCE RLS (migration 175) is a real
      # barrier, and a raw-pool read that skips the tenant context can no
      # longer hide behind the superuser's RLS bypass.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sensei_test
      JWT_SECRET: ci-e2e-secret
      SENSEI_ENV: test
      SENSEI_NO_ZIG: "1"
      # The suite performs bursty realtime/snapshot polling; throttling is
      # validated by unit tests, not here.
      FEATURE_RATE_LIMITING: "false"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      # Thirtieth-audit item 27: Trunk is pinned in .github/.tool-versions
      # (`trunk <version>` — same manifest the Dockerfile frontend stage
      # mirrors) and installed with `--version "$TRUNK_VERSION" --locked`,
      # never "latest" via the jetli action.
      - name: Install trunk (pinned from .github/.tool-versions)
        run: |
          set -euo pipefail
          TRUNK_VERSION="$(awk '$1=="trunk"{print $2}' .github/.tool-versions)"
          [ -n "$TRUNK_VERSION" ] || { echo "no trunk pin in .github/.tool-versions" >&2; exit 1; }
          cargo install trunk --version "$TRUNK_VERSION" --locked

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build frontend (trunk — the REAL bundle the router serves)
        working-directory: sensei-rs/crates/sensei-frontend
        run: |
          # Trunk config (Trunk.toml) also carries the flags; the explicit
          # wasm-opt pass below is the DETERMINISTIC enforcement: the
          # generated module uses bulk-memory + atomic instructions, so the
          # optimizer must run feature-consistent with the module
          # (twenty-third audit: do not suppress optimization — enable the
          # exact features the module needs).
          # Twenty-fourth audit P0: index.html now carries
          # data-wasm-opt="0" on the rust asset, so trunk's automatic
          # per-asset wasm-opt pass (which runs with a conservative feature
          # set and rejects these instructions) can no longer fail the
          # build BEFORE the post-pass below runs.
          trunk build --release
          for wasm in dist/*.wasm; do
            # Feature-complete validator set: wasm-bindgen's current glue
            # emits reference-types (externref) and may use sign-ext /
            # bulk-memory / threads; missing flags make the validator
            # reject used features ("all used features should be allowed").
            wasm-opt --enable-bulk-memory --enable-threads --enable-sign-ext \
              --enable-reference-types --enable-nontrapping-float-to-int \
              -O3 "$wasm" -o "$wasm"
          done
          cp -r dist ../../dist-frontend

      # Twenty-eighth audit P0 (release gate): SENSEI_NO_ZIG is set ONCE
      # at the job level (above) — every cargo invocation in this job
      # (frontend trunk build, API build, the migrations+seed step, the
      # API boot) relies on the pure-Rust path, and a step-scoped env var
      # silently missed the 'Run migrations + seed' recompile.
      - name: Build API
        working-directory: sensei-rs
        run: cargo build -p sensei-api --release

      # Thirtieth-first audit item 17: role provisioning BEFORE the
      # migration chain, mirroring the db-contract clean-bootstrap gate
      # step (a): the canonical production script
      # (sensei-rs/scripts/db/01-app-role.sh — the ONE source of the app
      # grants) defines sensei_migrator, sensei_governance_definer and the
      # least-privilege sensei_app role, so migration 165's
      # ALTER FUNCTION ... OWNER TO sensei_governance_definer transfer
      # lands exactly as it does in production. The tables do not exist
      # yet, so the script's table grants no-op here and land in the
      # post-chain re-run below.
      - name: Provision roles from the canonical grant script (pre-migration)
        working-directory: sensei-rs
        run: |
          set -euo pipefail
          PGHOST=localhost PGPORT=5432 \
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=postgres \
          POSTGRES_DB=sensei_test \
          SENSEI_APP_PASSWORD=sensei_app_e2e \
          SENSEI_MIGRATOR_PASSWORD=sensei_migrator_e2e \
          bash "$GITHUB_WORKSPACE/sensei-rs/scripts/db/01-app-role.sh"

      - name: Run migrations + seed
        working-directory: sensei-rs
        run: |
          DATABASE_URL_TEST=$DATABASE_URL cargo test -p sensei-db --test db_contract every_tenant
          cargo run -p sensei-api --release --bin sensei-api -- --migrate-only

      # Item 17: POST-chain re-run of the canonical grant script
      # (db-contract clean-bootstrap step (c)): the chain created every
      # table and the pre-tenant identity functions, so the script's
      # table-existence guards now fire — sensei_app receives
      # SELECT/INSERT/UPDATE/DELETE on every tenant table plus EXECUTE on
      # federation_governance_edges() and the migration-175 pre-tenant
      # auth functions, and sensei_governance_definer receives the SELECT
      # grants its SECURITY DEFINER bodies need.
      - name: Provision app grants from the canonical grant script (post-migration)
        working-directory: sensei-rs
        run: |
          set -euo pipefail
          PGHOST=localhost PGPORT=5432 \
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=postgres \
          POSTGRES_DB=sensei_test \
          SENSEI_APP_PASSWORD=sensei_app_e2e \
          SENSEI_MIGRATOR_PASSWORD=sensei_migrator_e2e \
          bash "$GITHUB_WORKSPACE/sensei-rs/scripts/db/01-app-role.sh"
          # The app role must be least-privilege: NOBYPASSRLS is what makes
          # FORCE RLS a real barrier for every assertion in the suite.
          PGPASSWORD=sensei_app_e2e psql -h localhost -U sensei_app -d sensei_test \
            -tAc "SELECT rolsuper || '/' || rolbypassrls FROM pg_roles WHERE rolname = current_user" \
            | grep -qx 'false/false'

      - name: Start API + frontend (single origin, AS sensei_app)
        working-directory: sensei-rs
        run: |
          # ONE process serves the bundle AND /api/v1 (the router's static
          # + SPA fallback): the frontend's API calls are same-origin
          # relative paths, so a separate python static server could never
          # work (no SPA deep-link fallback, no /api proxy, CORS).
          #
          # Item 17: the API connects AS the least-privilege sensei_app
          # role (the ONLY connection the production compose grants it) —
          # NOT the superuser DATABASE_URL above. Account seeding at
          # startup, login/session binding, and every module list the E2E
          # suite drives now run under FORCE RLS.
          DATABASE_URL=postgres://sensei_app:sensei_app_e2e@localhost:5432/sensei_test \
          API_PORT=8081 \
          SENSEI_ADMIN_PASSWORD='Test@1234' \
          SENSEI_CEO_PASSWORD='Test@1234' \
          cargo run -p sensei-api --release &
          # Item 79: the API exposes /livez and /readyz (NOT /healthz).
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/livez > /dev/null \
               && curl -sf http://127.0.0.1:8081/readyz > /dev/null; then
              echo "API ready"; break
            fi
            sleep 2
          done
          # The SPA entry point must answer client routes, not 404.
          curl -sf http://127.0.0.1:8081/ | grep -q "Starz Forge" \
            || { echo "frontend bundle not serving"; exit 1; }
          curl -sf http://127.0.0.1:8081/login | grep -q "Starz Forge" \
            || { echo "SPA deep-link fallback broken"; exit 1; }
          # Item 17: a REAL login must work through the app role (the
          # session binding INSERT is FORCE-RLS: the login proves the
          # migration-175 pre-tenant identity + tenant-scoped session
          # surfaces hold under sensei_app).
          curl -sf -X POST http://127.0.0.1:8081/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ceo@starz.com","password":"Test@1234"}' \
            | grep -q '"access_token"' \
            || { echo "app-role login failed"; exit 1; }

      - name: Seed e2e topology + operator grants + module fixtures
        run: |
          # The station/team-lead flows need a REAL principal context: a
          # site + work center + employee assignment for the E2E user and a
          # custom role granting ops:/tps: (the platform_admin static map
          # covers tenants/users/system only). Seed AFTER the API boot
          # (account seeding happens at startup).
          #
          # Item 17: module fixtures are ONE canonical row per module list
          # (the "NO RECORDS" page state is confirmed only when a list
          # REALLY has no rows; a seeded row that fails to render through
          # the app-role read path is a failed contract, not an empty
          # page). All rows are tenant-owned and inserted AS the
          # superuser — the same bootstrap channel every other gate uses;
          # the app role never seeds.
          PGPASSWORD=postgres psql -h localhost -U postgres -d sensei_test <<'SQL'
          INSERT INTO sites (id, tenant_id, name, site_code, timezone) VALUES
          ('11111111-1111-4111-8111-111111111111','00000000-0000-0000-0000-000000000001','E2E Site','E2E','UTC')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO work_centers (id, tenant_id, site_id, work_center_number, name) VALUES
          ('22222222-2222-4222-8222-222222222222','00000000-0000-0000-0000-000000000001','11111111-1111-4111-8111-111111111111','E2E-WC-01','E2E Work Center')
          ON CONFLICT (id) DO NOTHING;
          UPDATE users SET site_id = '11111111-1111-4111-8111-111111111111'
          WHERE tenant_id = '00000000-0000-0000-0000-000000000001' AND email = 'ceo@starz.com';
          INSERT INTO employee_assignments (tenant_id, user_id, site_id, work_center_id, is_active)
          SELECT tenant_id, id, '11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222', TRUE
          FROM users WHERE tenant_id = '00000000-0000-0000-0000-000000000001' AND email = 'ceo@starz.com'
          ON CONFLICT DO NOTHING;
          INSERT INTO roles (id, tenant_id, name, description, permissions)
          VALUES ('33333333-3333-4333-8333-333333333333','00000000-0000-0000-0000-000000000001','e2e_ops','E2E operator/team-lead permissions', ARRAY['ops:*','tps:*'])
          ON CONFLICT (tenant_id, name) DO NOTHING;
          INSERT INTO role_slots (id, tenant_id, role_name, slot_name, scope_kind, description)
          VALUES ('44444444-4444-4444-8444-444444444444','00000000-0000-0000-0000-000000000001','e2e_ops','e2e_ops_all','tenant','E2E full ops/tps grant')
          ON CONFLICT (tenant_id, slot_name) DO NOTHING;
          INSERT INTO principal_assignments (tenant_id, principal_id, slot_id)
          SELECT '00000000-0000-0000-0000-000000000001', u.id, '44444444-4444-4444-8444-444444444444'
          FROM users u WHERE u.tenant_id='00000000-0000-0000-0000-000000000001' AND u.email='ceo@starz.com'
          ON CONFLICT DO NOTHING;

          -- Item 17 module fixtures (see e2e/modules.spec.js modes).
          INSERT INTO products (id, tenant_id, product_number, name, unit_of_measure, is_active, product_type, created_at, updated_at)
          VALUES ('10000000-0000-4000-8000-000000000001','00000000-0000-0000-0000-000000000001','E2E-PROD-0001','E2E Fixture Product','pcs',TRUE,'finished_good',NOW(),NOW())
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO work_orders (id, tenant_id, wo_number, product_id, product_name, quantity, status, created_at, updated_at)
          VALUES ('20000000-0000-4000-8000-000000000001','00000000-0000-0000-0000-000000000001','E2E-WO-0001','10000000-0000-4000-8000-000000000001','E2E Fixture Product',100,'released',NOW(),NOW())
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO ncr_reports (id, tenant_id, ncr_number, title, severity, created_at, updated_at)
          VALUES ('30000000-0000-4000-8000-000000000001','00000000-0000-0000-0000-000000000001','E2E-NCR-0001','E2E fixture NCR','high',NOW(),NOW())
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO invoices (id, tenant_id, invoice_number, customer_id, customer_name, status, currency, due_date, notes, created_by, created_at, updated_at)
          SELECT '40000000-0000-4000-8000-000000000001','00000000-0000-0000-0000-000000000001','E2E-INV-0001','90000000-0000-4000-8000-000000000001','E2E Customer','draft','USD',NOW() + INTERVAL '30 days','',u.id,NOW(),NOW()
          FROM users u WHERE u.tenant_id='00000000-0000-0000-0000-000000000001' AND u.email='ceo@starz.com'
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO equipment (id, tenant_id, equipment_number, name, created_at, updated_at)
          VALUES ('50000000-0000-4000-8000-000000000001','00000000-0000-0000-0000-000000000001','E2E-EQ-0001','E2E Fixture Equipment',NOW(),NOW())
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO maintenance_work_requests (id, tenant_id, request_number, equipment_id, title, requested_by, created_at, updated_at)
          SELECT '60000000-0000-4000-8000-000000000001','00000000-0000-0000-0000-000000000001','E2E-WR-0001',
          '50000000-0000-4000-8000-000000000001','E2E fixture work request',u.id,NOW(),NOW()
          FROM users u WHERE u.tenant_id='00000000-0000-0000-0000-000000000001' AND u.email='ceo@starz.com'
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO inventory_items (id, tenant_id, site_id, product_id, quantity_on_hand, quantity_reserved, quantity_available, location, created_at, updated_at)
          VALUES ('70000000-0000-4000-8000-000000000001','00000000-0000-0000-0000-000000000001','11111111-1111-4111-8111-111111111111','10000000-0000-4000-8000-000000000001',100,0,100,'E2E-AISLE',NOW(),NOW())
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO andons (id, tenant_id, andon_number, work_center_id, site_id, issue_type, severity, description, raised_by, created_at)
          SELECT '80000000-0000-4000-8000-000000000001','00000000-0000-0000-0000-000000000001','AND-E2E-0001',
          '22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111',
          'material','medium','E2E fixture andon',u.id,NOW()
          FROM users u WHERE u.tenant_id='00000000-0000-0000-0000-000000000001' AND u.email='ceo@starz.com'
          ON CONFLICT (id) DO NOTHING;
          SQL

      - name: Install Playwright
        run: |
          cd sensei-rs/e2e
          npm ci
          npx playwright install --with-deps chromium

          - name: Run E2E + axe
          run: |
          # Config lives at sensei-rs/playwright.config.js (baseURL etc.) —
          # Playwright only discovers it from the working directory, so run
          # from sensei-rs, not from e2e/.
          cd sensei-rs
          E2E_BASE_URL=http://localhost:8081 \
          E2E_ADMIN_EMAIL=ceo@starz.com \
          E2E_ADMIN_PASSWORD=Test@1234 \
          npx playwright test --reporter=line
