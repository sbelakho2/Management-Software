name: db-contract

on:
  push:
    branches: [main]
  pull_request:

env:
  # The database each PostgreSQL service container ACTUALLY creates on
  # first boot (POSTGRES_DB below). The instance never creates a database
  # named after the POSTGRES_USER ('sensei'), so every control/smoke psql
  # connection must name THIS database explicitly — psql would otherwise
  # fall back to the role-named database and fail with FATAL: database
  # "sensei" does not exist (twenty-seventh audit P0 — release proof
  # chain: the clean-bootstrap gate's control connection used exactly
  # that implicit fallback and could never run).
  DATABASE_NAME: sensei_test

jobs:
  fresh-database-gate:
    name: Fresh PostgreSQL migration + contract gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sensei
          POSTGRES_PASSWORD: sensei_test
          POSTGRES_DB: sensei_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sensei -d sensei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sensei-rs
    # Twenty-eighth audit P0 (release gate): the pure-Rust path
    # (SENSEI_NO_ZIG=1, the documented switch — see the comment on the
    # Fresh-database step) is set ONCE at the job level so EVERY cargo
    # invocation in this job uses it; a step-scoped env var would silently
    # miss a later cargo step in the same job.
    env:
      SENSEI_NO_ZIG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Twentieth audit P1 (CI): the workspace crate sensei-zt builds a
      # Zig library by default and REQUIRES the pinned Zig toolchain
      # (>= 0.15.0). The DB contract gate exercises Rust/Postgres
      # semantics only, so it must build the pure-Rust variant —
      # SENSEI_NO_ZIG=1 is the documented switch for that profile.
      # Pinning Zig here would also work; the pure-Rust build keeps the
      # gate hermetic and fast.
      - name: Fresh-database migration + DB contract gate
        run: |
          cargo test -p sensei-db --test db_contract -- \
            --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://sensei:sensei_test@localhost:5433/${{ env.DATABASE_NAME }}

  # Twenty-second audit P0/P1 + twenty-third audit P1: the gate above
  # proves the migrated schema against a SUPERUSER connection. RLS (FORCE
  # ROW LEVEL SECURITY, migration 098) is only a real barrier when the
  # application connects as a NON-OWNER, least-privilege role — exactly
  # how docker-compose.prod connects. This job runs the SAME db_contract
  # suite on its own fresh database (the suite applies the full migration
  # chain, dropping/recreating per test), then creates a REAL `sensei_app`
  # application role by LITERALLY executing the canonical production grant
  # script (docker/postgres-init/01-app-role.sh — the ONE source of the
  # production app grants; this job no longer maintains its own grant
  # list, and the old GRANT EXECUTE ON ALL FUNCTIONS is gone), and finally
  # runs an app-role SERVICE-PATH smoke over its own psql connection:
  #   (a) the role is NOBYPASSRLS / NOSUPERUSER / NOCREATEDB /
  #       NOCREATEROLE and the tenant-scoped service path is RLS-gated —
  #       FORCE RLS hides every row without app.tenant_id, and exactly the
  #       context tenant's rows are visible inside a transaction that
  #       sets it (reads AND writes — tenant-scoped INSERT/UPDATE/DELETE
  #       succeed, a cross-tenant write is denied);
  #   (b) the federation governance channel works with ONLY the audited
  #       EXECUTE grant on the no-argument form —
  #       federation_governance_edges() returns the source tenant's peer
  #       rows under app.tenant_id, and the migration/admin-only
  #       federation_governance_edges_for(uuid) variant is REFUSED
  #       (permission denied) — the explicit-grant discipline holds;
  #   (c) the replication fanout queue table is writable under the tenant
  #       context (the twenty-third-audit fanout INSERT path).
  #
  # WHY the db_contract SUITE is NOT re-invoked with DATABASE_URL_TEST
  # pointing at sensei_app (twenty-third audit P1 item 4 — documented
  # choice): the suite is written for a superuser harness. Every test
  # seeds its fixtures with RAW SQL on FORCE-RLS tables (sites,
  # site_manifests, country_policies, federation_memberships,
  # operational_events, ...) OUTSIDE any app.tenant_id transaction — FORCE
  # RLS denies those writes for ANY non-BYPASSRLS role, including the
  # table OWNER (that is what FORCE means), so the curated candidates fail
  # at their first seed, not at any grant boundary:
  #   - federation_edges_load_under_non_owner_role seeds peer manifests +
  #     policies + memberships raw, and its SECURITY DEFINER governance
  #     function only crosses the tenant boundary when it stays owned by
  #     the RLS-bypassing migration owner (a NOBYPASSRLS sensei_app that
  #     re-runs the migration chain would own the function and the FORCE
  #     policies of the peer tables would hide every peer row);
  #   - integration_producer_reconcile_and_epistemics /
  #     andon_mutations_cannot_cross_sites seed sites (FORCE RLS) raw;
  #   - the suite also DROPs every table per test (owner-only) and
  #     provisions probe LOGIN roles (CREATEROLE).
  # Running the suite under sensei_app was verified locally to fail at the
  # first FORCE-RLS seed (error 42501 "new row violates row-level security
  # policy") even with the app role owning a fresh database and running
  # the migration chain itself. The full suite therefore stays on the
  # superuser connection of this job (and of the fresh-database-gate job),
  # and the app-role service-path smoke below is the executable
  # least-privilege gate: it proves the REAL production role with the REAL
  # canonical grants can run the service path (RLS-scoped CRUD + the
  # federation governance channel + the fanout queue write).
  least-privilege-app-role-gate:
    name: Least-privilege sensei_app role + RLS service-path gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sensei
          POSTGRES_PASSWORD: sensei_test
          POSTGRES_DB: sensei_test
        ports:
          # 5434 (not 5433): keeps this job independent of the primary gate
          # even when both land on one self-hosted runner.
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U sensei -d sensei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sensei-rs
    # Twenty-eighth audit P0 (release gate): job-level SENSEI_NO_ZIG — the
    # pure-Rust path for EVERY cargo invocation in this job (the DB
    # contract suite below AND the clean-bootstrap gate's `cargo run`
    # migrate-only step further down); see the comment on the suite step.
    env:
      SENSEI_NO_ZIG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fresh-database migration + DB contract suite
        run: |
          cargo test -p sensei-db --test db_contract -- \
            --test-threads=1
        env:
          DATABASE_URL_TEST: postgres://sensei:sensei_test@localhost:5434/${{ env.DATABASE_NAME }}
      - name: Ensure psql is available on the runner
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      # Twenty-third audit P1 (grant unification): the audited app grants
      # live in ONE canonical script — docker/postgres-init/01-app-role.sh
      # — and this CI job executes THAT file instead of maintaining its own
      # grant list. The script grants table DML on the tenant tables plus
      # EXECUTE ONLY on federation_governance_edges() — it never runs
      # GRANT EXECUTE ON ALL FUNCTIONS (that would hand the app role every
      # migration/admin function) and never grants
      # federation_governance_edges_for(uuid) (migration/admin-only).
      # The suite above left a fully migrated schema on this database, so
      # the script's grants apply to every table and function it names.
      - name: Create least-privilege sensei_app from the canonical grant script
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=5434 PGUSER=sensei PGPASSWORD=sensei_test
          export PGDATABASE="$DATABASE_NAME"
          # Idempotent reset: fresh CI containers have no role; a re-run on
          # a database where the role owns grants must drop them first.
          psql -X -q -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'sensei_app') THEN
                  EXECUTE 'DROP OWNED BY sensei_app CASCADE';
                  EXECUTE 'DROP ROLE sensei_app';
              END IF;
          END
          $$;
          SQL
          # Execute the PRODUCTION script verbatim (repo checkout root):
          # docker/postgres-init/01-app-role.sh. It connects with
          # --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" against the
          # service on PGHOST/PGPORT and reads BOTH SENSEI_APP_PASSWORD and
          # SENSEI_MIGRATOR_PASSWORD (twenty-fifth audit P0: the script
          # hard-fails when either is unset — exporting only the app password
          # made this step (and everything after it: the app-role smoke AND
          # the clean-bootstrap gate) unreachable).
          POSTGRES_USER=sensei \
          POSTGRES_PASSWORD=sensei_test \
          POSTGRES_DB="$DATABASE_NAME" \
          SENSEI_APP_PASSWORD=x \
          SENSEI_MIGRATOR_PASSWORD=migrate \
          bash "$GITHUB_WORKSPACE/docker/postgres-init/01-app-role.sh"
      # Seed tenant fixtures AS the superuser (the app role may never
      # create rows outside its RLS context; the db-contract suite itself
      # seeds identically). products carries the migration-098 fail-closed
      # FORCE RLS policy (the tenants table has no tenant_id column, so it
      # is not RLS-isolated — products is the audited probe). The
      # federation fixtures (membership + peer site manifest + country
      # policy + version) let the app-role smoke prove the governance
      # function channel: under app.tenant_id the no-argument function
      # returns the peer row.
      - name: Seed tenant + federation fixtures (superuser)
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=5434 PGUSER=sensei PGPASSWORD=sensei_test
          export PGDATABASE="$DATABASE_NAME"
          psql -X -q -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants (id, name, slug)
          VALUES ('00000000-0000-4000-8000-00000000000a', 'app-a', 'app-a'),
                 ('00000000-0000-4000-8000-00000000000b', 'app-b', 'app-b');
          INSERT INTO products (id, tenant_id, product_number, name, unit_of_measure, is_active, product_type, created_at, updated_at)
          VALUES ('10000000-0000-4000-8000-00000000000a',
                  '00000000-0000-4000-8000-00000000000a', 'APP-A-1', 'A',
                  'pcs', TRUE, 'finished_good', NOW(), NOW()),
                 ('10000000-0000-4000-8000-00000000000b',
                  '00000000-0000-4000-8000-00000000000b', 'APP-B-1', 'B',
                  'pcs', TRUE, 'finished_good', NOW(), NOW());
          -- Federation governance fixtures (peer B hosts one Morocco site).
          INSERT INTO sites (id, tenant_id, site_code, name)
          VALUES ('20000000-0000-4000-8000-00000000000b',
                  '00000000-0000-4000-8000-00000000000b', 'BMA', 'Peer B Morocco');
          INSERT INTO site_manifests (tenant_id, site_id, country, capabilities)
          VALUES ('00000000-0000-4000-8000-00000000000b',
                  '20000000-0000-4000-8000-00000000000b', 'Morocco', '["SMT"]');
          INSERT INTO country_policies (tenant_id, country, language, currency, unit_system, week_start, holiday_schedule, timezone, data_residency, retention_days, employment_data_visibility, local_document_requirements)
          VALUES ('00000000-0000-4000-8000-00000000000b', 'Morocco', 'fr', 'MAD',
                  'metric', 'monday', '[]'::jsonb, 'Africa/Casablanca', 'ma',
                  365, 'restricted', '[]'::jsonb);
          INSERT INTO country_policy_versions (tenant_id, country, revision, language, currency, data_residency)
          VALUES ('00000000-0000-4000-8000-00000000000b', 'Morocco', 1, 'fr', 'MAD', 'ma');
          INSERT INTO federation_memberships (tenant_id, peer_tenant_id)
          VALUES ('00000000-0000-4000-8000-00000000000a',
                  '00000000-0000-4000-8000-00000000000b');
          SQL
      # App-role service-path smoke: every psql below connects AS
      # sensei_app (its own LOGIN, password 'x') — the canonical grants are
      # all it has.
      - name: App-role service path — RLS-scoped CRUD + federation governance channel
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=5434 PGUSER=sensei_app PGPASSWORD=x
          # The instance-created database, aligned with every other control
          # connection via DATABASE_NAME (twenty-seventh audit P0) — never
          # the implicit role-named default.
          export PGDATABASE="$DATABASE_NAME"
          TA='00000000-0000-4000-8000-00000000000a'
          TB='00000000-0000-4000-8000-00000000000b'
          # (a) identity: the probe really runs AS the app role.
          CURRENT="$(psql -X -q -tAc 'SELECT current_user')"
          [ "$CURRENT" = "sensei_app" ] || { echo "expected sensei_app, got '$CURRENT'"; exit 1; }
          # (b) least-privilege flags: NOSUPERUSER NOBYPASSRLS NOCREATEDB
          #     NOCREATEROLE (the canonical script creates the role with
          #     no attributes — PostgreSQL defaults are all NO*).
          FLAGS="$(psql -X -q -tAc "SELECT rolsuper || '/' || rolbypassrls || '/' || rolcreatedb || '/' || rolcreaterole FROM pg_roles WHERE rolname = current_user")"
          [ "$FLAGS" = "false/false/false/false" ] || { echo "role is not least-privilege: '$FLAGS'"; exit 1; }
          # (c) tenant-scoped service path WITHOUT app.tenant_id: FORCE RLS
          #     hides every row (the WHERE clause alone is not enough).
          HIDDEN="$(psql -X -q -tAc "SELECT COUNT(*) FROM products WHERE tenant_id = '$TA'")"
          [ "$HIDDEN" = "0" ] || { echo "RLS did not hide rows without app.tenant_id (count=$HIDDEN)"; exit 1; }
          # (d) The service path INSIDE an explicit transaction that sets
          #     app.tenant_id with SET LOCAL (transaction-scoped — the
          #     service convention): own-tenant rows visible, the other
          #     tenant's rows still hidden, and tenant-scoped WRITES
          #     succeed while a cross-tenant write is denied. Every
          #     capture keeps ONLY the count (| tail -1): SET LOCAL
          #     prints no tuple and the count is the LAST result of the
          #     transaction, so the captured value compares cleanly to
          #     1/0 (twenty-fifth audit P0 — the previous set_config +
          #     COUNT capture compared the config echo to the expected
          #     count and failed before the federation assertions ran).
          VISIBLE_A="$(psql -X -q -tA -c "BEGIN; SET LOCAL app.tenant_id = '$TA'; SELECT COUNT(*) FROM products WHERE tenant_id = '$TA'; COMMIT;" | tail -1)"
          [ "$VISIBLE_A" = "1" ] || { echo "own-tenant row invisible with app.tenant_id (count=$VISIBLE_A)"; exit 1; }
          VISIBLE_B="$(psql -X -q -tA -c "BEGIN; SET LOCAL app.tenant_id = '$TA'; SELECT COUNT(*) FROM products WHERE tenant_id = '$TB'; COMMIT;" | tail -1)"
          [ "$VISIBLE_B" = "0" ] || { echo "cross-tenant row visible under tenant-A context (count=$VISIBLE_B)"; exit 1; }
          # Service-path write under the tenant context: INSERT, UPDATE,
          # DELETE of OWN-tenant rows all succeed inside the context tx.
          psql -X -q -v ON_ERROR_STOP=1 -c "
            BEGIN;
            SET LOCAL app.tenant_id = '$TA';
            INSERT INTO products (id, tenant_id, product_number, name, unit_of_measure, is_active, product_type, created_at, updated_at)
            VALUES ('30000000-0000-4000-8000-00000000000a', '$TA', 'APP-A-W1', 'W', 'pcs', TRUE, 'finished_good', NOW(), NOW());
            UPDATE products SET name = 'W-updated' WHERE tenant_id = '$TA' AND product_number = 'APP-A-W1';
            DELETE FROM products WHERE tenant_id = '$TA' AND product_number = 'APP-A-W1';
            COMMIT;"
          WROTE="$(psql -X -q -tA -c "BEGIN; SET LOCAL app.tenant_id = '$TA'; SELECT COUNT(*) FROM products WHERE tenant_id = '$TA' AND product_number = 'APP-A-W1'; COMMIT;" | tail -1)"
          [ "$WROTE" = "0" ] || { echo "tenant-scoped write/delete did not persist (count=$WROTE)"; exit 1; }
          # A cross-tenant write under tenant-A context is DENIED by the
          # FORCEd policy (fail-closed, even for INSERT).
          CROSS_WRITE="$(psql -X -q -v ON_ERROR_STOP=1 -c "BEGIN; SET LOCAL app.tenant_id = '$TA'; INSERT INTO products (id, tenant_id, product_number, name, unit_of_measure, is_active, product_type, created_at, updated_at) VALUES ('30000000-0000-4000-8000-00000000000b', '$TB', 'X-1', 'X', 'pcs', TRUE, 'finished_good', NOW(), NOW()); COMMIT;" 2>&1 || true)"
          case "$CROSS_WRITE" in
            *"violates row-level security policy"*) : ;;
            *) echo "cross-tenant write was not denied: '$CROSS_WRITE'"; exit 1;;
          esac
          # (e) FEDERATION GOVERNANCE CHANNEL (twenty-third audit P1 grant
          #     unification): the canonical grants give the app role
          #     EXECUTE ONLY on the no-argument function. Under
          #     app.tenant_id = tenant A the function returns tenant A's
          #     peer rows (the seed above) — the SECURITY DEFINER owner
          #     (sensei_migrator today, sensei_governance_definer once the
          #     migration chain flips ownership) does the cross-tenant
          #     read; the app role supplies only the session context. The
          #     caller-supplied-tenant escape hatch
          #     federation_governance_edges_for(uuid) is REFUSED: it is
          #     revoked from PUBLIC and the canonical script never grants
          #     it — permission denied proves the explicit-grant
          #     discipline (no ON ALL FUNCTIONS anywhere). Capture keeps
          #     ONLY the function output (| tail -1), same convention as
          #     the RLS counts above.
          GOV="$(psql -X -q -tA -c "BEGIN; SET LOCAL app.tenant_id = '$TA'; SELECT peer_country FROM federation_governance_edges() ORDER BY peer_country; COMMIT;" | tail -1)"
          [ "$GOV" = "Morocco" ] || { echo "governance function did not return the peer under tenant context (got '$GOV')"; exit 1; }
          GOV_NONE="$(psql -X -q -tA -c "BEGIN; SELECT peer_country FROM federation_governance_edges(); COMMIT;" | tail -1)"
          [ -z "$GOV_NONE" ] || { echo "governance function exposed peers without app.tenant_id (got '$GOV_NONE')"; exit 1; }
          GOV_FOR="$(psql -X -q -v ON_ERROR_STOP=1 -tAc "SELECT peer_country FROM federation_governance_edges_for('$TA')" 2>&1 || true)"
          case "$GOV_FOR" in
            *"permission denied"*) : ;;
            *) echo "federation_governance_edges_for(uuid) was not denied for the app role: '$GOV_FOR'"; exit 1;;
          esac
          # (f) REPLICATION FANOUT QUEUE PATH (twenty-third audit P1): the
          #     site_replication_log row the enqueue fanout writes is
          #     reachable by the app role under the tenant context —
          #     table DML from the canonical grants + FORCE RLS scoping.
          psql -X -q -v ON_ERROR_STOP=1 -c "
            BEGIN;
            SET LOCAL app.tenant_id = '$TA';
            INSERT INTO site_replication_log (tenant_id, site_id, entity_type, entity_id, projection, source_event_id, schema_version, projection_type, projection_revision, data_policy, status, target_tenant_id, target_site_id, target_jurisdiction, edge_policy)
            VALUES ('$TA', NULL, 'work_order', '40000000-0000-4000-8000-00000000000a', '{}'::jsonb, 'evt-smoke-1', 1, 'work_order', 1, 'internal', 'pending', '$TB', '20000000-0000-4000-8000-00000000000b', 'ma', '{}'::jsonb);
            DELETE FROM site_replication_log WHERE tenant_id = '$TA' AND source_event_id = 'evt-smoke-1';
            COMMIT;"
          echo "app-role service path OK: current_user=$CURRENT flags=$FLAGS"
          echo "  rows without app.tenant_id context: $HIDDEN (must be 0)"
          echo "  with tenant-A context: A rows=$VISIBLE_A B rows=$VISIBLE_B"
          echo "  governance peer under tenant-A context: $GOV"
          echo "  governance _for(uuid) variant: permission denied (as required)"
      # Twenty-fourth + twenty-fifth audit P0 (clean-bootstrap gate — the
      # PRODUCTION bootstrap order): the job above ran the chain as the
      # SUPERUSER (the db_contract suite's harness), then exercised
      # sensei_app against THAT schema. Production does NOT work that way
      # anymore: a fresh database is migrated by the dedicated `migrate`
      # container AS sensei_migrator — a deployment-only
      # NOSUPERUSER BYPASSRLS NOCREATEDB role (twenty-fifth audit P0:
      # BYPASSRLS is required because FORCE RLS binds the table OWNER too
      # and the chain seeds/backfills FORCE-RLS tables cross-tenant with
      # no app.tenant_id context — migration 122 country_policies;
      # NOCREATEDB because the bootstrap superuser creates databases) —
      # that owns every object the chain creates, and only then does the
      # API start as sensei_app. This step reproduces that exact order on
      # a fresh database. Twenty-eighth audit P0 fixed the ORDER of the
      # canonical script around the chain: migration 165's
      # ALTER FUNCTION ... OWNER TO sensei_governance_definer executes as
      # the non-superuser sensei_migrator, and PostgreSQL requires the NEW
      # owner to hold CREATE on the function's schema — a pre-migration
      # script run grants the definer USAGE + CREATE ON SCHEMA public, and
      # the table SELECT grants the definer's SECURITY DEFINER bodies need
      # (BYPASSRLS does not grant table SELECT) land when the SAME script
      # is re-run after the chain created the federation tables:
      #   (a) superuser creates the database and pre-creates the extensions
      #       (production initdb does the same via ./postgres-init/
      #       01-init.sql BEFORE the role script runs — the migrator must
      #       never need CREATE EXTENSION privileges), then runs the
      #       CANONICAL production script (docker/postgres-init/
      #       01-app-role.sh — executed verbatim, as everywhere) ONCE
      #       against the fresh database: it defines ALL THREE roles —
      #       sensei_migrator holds BYPASSRLS NOCREATEDB + CREATE ON
      #       SCHEMA public + ALL ON the database, sensei_governance_definer
      #       (NOLOGIN BYPASSRLS — the narrower owner migration 165 must
      #       flip the governance functions to) is pre-created AND granted
      #       USAGE + CREATE ON SCHEMA public (twenty-eighth audit P0: the
      #       pre-migration schema grant the chain-side owner transfer
      #       requires), and sensei_app is stripped of schema CREATE
      #       (REVOKE ... FROM PUBLIC and FROM sensei_app) and inherits
      #       table DML through default privileges declared FOR ROLE
      #       sensei_migrator. The definer's guarded table grants no-op
      #       here — the federation tables do not exist yet;
      #   (b) the migration chain runs AS sensei_migrator through the real
      #       production path: `cargo run -p sensei-api -- --migrate-only`
      #       (the API binary's migrate-only mode — what the compose
      #       `migrate` service invokes). Migration 165's owner transfer
      #       now SUCCEEDS because the definer holds schema USAGE+CREATE
      #       from (a);
      #   (c) the canonical script runs a SECOND time (production's
      #       post-migrate `grants` one-shot in docker-compose.prod.yml
      #       does the same): the chain has now created the FORCE-RLS
      #       federation tables, so the script's table-existence guards
      #       fire and sensei_governance_definer receives SELECT on
      #       federation_memberships, site_manifests, country_policies and
      #       country_policy_versions — the grants its SECURITY DEFINER
      #       bodies execute under;
      #   (d) assertions: schema + object OWNERSHIP (every table is owned
      #       by sensei_migrator; both governance functions are owned by
      #       sensei_governance_definer — never the app role or the
      #       superuser), the migrator's deployment-only role attributes,
      #       the governance-definer role's attributes + membership
      #       (sensei_migrator member, sensei_app NOT a member), the
      #       definer's schema + table privileges (has_schema_privilege /
      #       has_table_privilege — BYPASSRLS alone would not let the
      #       definer bodies read the peer tables), sensei_app CANNOT
      #       CREATE TABLE, sensei_app CAN SELECT from a migrated tenant
      #       table, sensei_app CAN EXECUTE
      #       federation_governance_edges() and CANNOT execute
      #       federation_governance_edges_for(uuid).
      - name: Clean-bootstrap gate — fresh DB migrated AS sensei_migrator (production bootstrap order)
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=5434 PGUSER=sensei PGPASSWORD=sensei_test
          # The CONTROL connection names the database the instance ACTUALLY
          # created (DATABASE_NAME — psql's implicit fallback to the
          # role-named 'sensei' database does not exist and FATALs, so the
          # gate's very first psql could never run; twenty-seventh audit
          # P0). This psql only hosts the DROP/CREATE of the fresh
          # clean_bootstrap database below.
          export PGDATABASE="$DATABASE_NAME"
          # (1) Fresh database (DROP IF EXISTS keeps self-hosted runner
          #     re-runs clean; PG16 DROP ... WITH (FORCE) kills leftovers).
          psql -X -q -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS clean_bootstrap WITH (FORCE)'
          psql -X -q -v ON_ERROR_STOP=1 -c 'CREATE DATABASE clean_bootstrap'
          # Extensions exactly as the production initdb does (root
          # ./postgres-init/01-init.sql) — the migrator never creates them.
          psql -X -q -v ON_ERROR_STOP=1 -d clean_bootstrap <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL
          # (a) FIRST canonical role-script run against the FRESH database
          #     (executed verbatim — the same file production mounts as
          #     02-app-role.sh at initdb, and the job above ran it on
          #     sensei_test). Roles already exist server-wide; the script's
          #     DO blocks no-op and the ALTERs converge. Twenty-eighth
          #     audit P0: this PRE-MIGRATION run grants
          #     sensei_governance_definer USAGE + CREATE ON SCHEMA public —
          #     migration 165's ALTER FUNCTION ... OWNER TO
          #     sensei_governance_definer (step (b)) executes as the
          #     non-superuser sensei_migrator, and PostgreSQL requires the
          #     NEW owner to hold CREATE on the object's schema. Without
          #     this grant the clean bootstrap failed at migration 165
          #     ("permission denied for schema public"). The definer's
          #     table SELECT grants are guarded on table existence in the
          #     script, so they no-op here (the chain has not created the
          #     tables yet) and land in the step-(c) re-run.
          POSTGRES_USER=sensei \
          POSTGRES_PASSWORD=sensei_test \
          POSTGRES_DB=clean_bootstrap \
          SENSEI_APP_PASSWORD=x \
          SENSEI_MIGRATOR_PASSWORD=migrate \
          bash "$GITHUB_WORKSPACE/docker/postgres-init/01-app-role.sh"
          # (b) Run the ENTIRE migration chain AS sensei_migrator through
          #     the production binary path (--migrate-only; exits 0 only
          #     when the chain applied cleanly). SENSEI_NO_ZIG comes from
          #     the job-level env (twenty-eighth audit P0). Migration
          #     165's owner transfer now SUCCEEDS: the definer holds
          #     schema USAGE+CREATE from the step-(a) run, so the
          #     non-superuser chain can flip both governance functions to
          #     sensei_governance_definer.
          DATABASE_URL=postgres://sensei_migrator:migrate@localhost:5434/clean_bootstrap \
          cargo run -p sensei-api -- --migrate-only
          # (c) SECOND canonical role-script run (POST-migration — the
          #     production `grants` one-shot in docker-compose.prod.yml
          #     runs the identical re-run after its `migrate` one-shot).
          #     The chain has now created the FORCE-RLS federation tables
          #     the governance bodies read, so the script's
          #     table-existence guards fire and sensei_governance_definer
          #     receives SELECT on federation_memberships, site_manifests,
          #     country_policies and country_policy_versions — BYPASSRLS
          #     does NOT grant table SELECT, and without these the
          #     definer-owned SECURITY DEFINER bodies would fail at
          #     runtime. Everything else in the script re-applies
          #     idempotently (attributes, passwords, schema grants,
          #     sensei_app's table DML and the function EXECUTE surface).
          POSTGRES_USER=sensei \
          POSTGRES_PASSWORD=sensei_test \
          POSTGRES_DB=clean_bootstrap \
          SENSEI_APP_PASSWORD=x \
          SENSEI_MIGRATOR_PASSWORD=migrate \
          bash "$GITHUB_WORKSPACE/docker/postgres-init/01-app-role.sh"
          # (d-1) Schema assertions AS sensei_migrator: migration ledger is
          #       populated and the audited probe table exists.
          export PGDATABASE=clean_bootstrap PGUSER=sensei_migrator PGPASSWORD=migrate
          MIGRATED="$(psql -X -q -tAc 'SELECT COUNT(*) FROM _sqlx_migrations')"
          [ "$MIGRATED" -ge 140 ] || { echo "migration ledger too small: $MIGRATED"; exit 1; }
          PRODUCTS="$(psql -X -q -tAc "SELECT to_regclass('public.products')")"
          [ "$PRODUCTS" = "products" ] || { echo "products table missing after migrator chain: '$PRODUCTS'"; exit 1; }
          # (d-2) OWNERSHIP: the chain really ran AS sensei_migrator —
          #      every table is owned by sensei_migrator (the migration
          #      role is the table owner). The SECURITY DEFINER governance
          #      functions are the exception: migration 165 flips BOTH
          #      federation_governance_edges() and
          #      federation_governance_edges_for(uuid) to
          #      sensei_governance_definer when that role exists (the
          #      canonical script pre-created it in (a) — asserted in
          #      (d-4) — so the flip applies in THIS gate). The
          #      migration guard SKIPS the flip on a minimal bootstrap
          #      that never ran the role script, leaving the
          #      chain-created owner sensei_migrator — the assertion
          #      derives the expected owner from the role's presence so
          #      both bootstrap shapes are asserted correctly
          #      (twenty-seventh audit P0). Either way the owner is
          #      NEVER the app role or the superuser: the RLS-bypassing
          #      definer owner is what lets the governance channel read
          #      the peer tenants' FORCE-RLS rows.
          TABLE_OWNER="$(psql -X -q -tAc "SELECT pg_get_userbyid(relowner) FROM pg_class WHERE relname = 'products' AND relnamespace = 'public'::regnamespace")"
          [ "$TABLE_OWNER" = "sensei_migrator" ] || { echo "products owned by '$TABLE_OWNER', expected sensei_migrator"; exit 1; }
          if [ "$(psql -X -q -tAc "SELECT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sensei_governance_definer')")" = "t" ]; then
            EXPECTED_FN_OWNER="sensei_governance_definer"
          else
            EXPECTED_FN_OWNER="sensei_migrator"
          fi
          FN_OWNER="$(psql -X -q -tAc "SELECT pg_get_userbyid(p.proowner) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname = 'federation_governance_edges' AND p.pronargs = 0")"
          [ "$FN_OWNER" = "$EXPECTED_FN_OWNER" ] || { echo "federation_governance_edges() owned by '$FN_OWNER', expected $EXPECTED_FN_OWNER (migration 165 flips to sensei_governance_definer when the role exists)"; exit 1; }
          FN_FOR_OWNER="$(psql -X -q -tAc "SELECT pg_get_userbyid(p.proowner) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname = 'federation_governance_edges_for' AND p.pronargs = 1")"
          [ "$FN_FOR_OWNER" = "$EXPECTED_FN_OWNER" ] || { echo "federation_governance_edges_for(uuid) owned by '$FN_FOR_OWNER', expected $EXPECTED_FN_OWNER (migration 165 flips to sensei_governance_definer when the role exists)"; exit 1; }
          # (d-3) Migrator role attributes (twenty-fifth audit P0): the
          #      DEPLOYMENT-ONLY migration identity —
          #      NOSUPERUSER BYPASSRLS NOCREATEDB NOCREATEROLE — can DDL
          #      and own the chain AND bypass FORCE RLS for its
          #      cross-tenant seeds/backfills (a NOBYPASSRLS migrator
          #      cannot cleanly bootstrap: FORCE RLS binds the table owner
          #      too); cannot create databases (the bootstrap superuser
          #      does) or administer roles.
          FLAGS="$(psql -X -q -tAc "SELECT rolsuper || '/' || rolbypassrls || '/' || rolcreatedb || '/' || rolcreaterole FROM pg_roles WHERE rolname = 'sensei_migrator'")"
          [ "$FLAGS" = "false/true/false/false" ] || { echo "sensei_migrator is not the expected deployment-only role: '$FLAGS'"; exit 1; }
          # (d-4) Governance-definer role (twenty-fifth audit P0): the
          #      canonical script pre-creates sensei_governance_definer —
          #      NOLOGIN NOSUPERUSER BYPASSRLS NOCREATEDB NOCREATEROLE
          #      (never a connection identity; the RLS bypass exists only
          #      for the SECURITY-DEFINER governance bodies' FORCE-RLS
          #      peer reads), and grants sensei_migrator membership so the
          #      non-superuser chain CAN flip the governance functions'
          #      OWNER to it (ALTER OWNER requires membership in the new
          #      owner role). sensei_app is never a member — asserted
          #      right below.
          DEFINER_FLAGS="$(psql -X -q -tAc "SELECT rolsuper || '/' || rolbypassrls || '/' || rolcreatedb || '/' || rolcreaterole || '/' || rolcanlogin FROM pg_roles WHERE rolname = 'sensei_governance_definer'")"
          [ "$DEFINER_FLAGS" = "false/true/false/false/false" ] || { echo "sensei_governance_definer is not the expected NOLOGIN BYPASSRLS definer role: '$DEFINER_FLAGS'"; exit 1; }
          # pg_auth_members rows are visibility-filtered for non-members,
          # so probe the membership as the superuser.
          DEF_MEMBERSHIP="$(PGUSER=sensei PGPASSWORD=sensei_test psql -X -q -tAc "SELECT EXISTS (SELECT 1 FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.roleid WHERE r.rolname = 'sensei_governance_definer' AND m.member = (SELECT oid FROM pg_roles WHERE rolname = 'sensei_migrator'))")"
          [ "$DEF_MEMBERSHIP" = "t" ] || { echo "sensei_migrator is not a member of sensei_governance_definer (chain ALTER OWNER would fail): '$DEF_MEMBERSHIP'"; exit 1; }
          # (d-4-2) The runtime app role is NEVER a member of the definer
          #      (twenty-eighth audit P0): membership would hand sensei_app
          #      the definer's BYPASSRLS attribute (any role that is a
          #      member can SET ROLE to it) and collapse the
          #      SECURITY-DEFINER owner boundary — the app identity must
          #      stay NOBYPASSRLS under FORCE RLS. Only the
          #      deployment-only sensei_migrator (asserted above) may be a
          #      member.
          APP_DEF_MEMBERSHIP="$(PGUSER=sensei PGPASSWORD=sensei_test psql -X -q -tAc "SELECT EXISTS (SELECT 1 FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.roleid JOIN pg_roles mem ON mem.oid = m.member WHERE r.rolname = 'sensei_governance_definer' AND mem.rolname = 'sensei_app')")"
          [ "$APP_DEF_MEMBERSHIP" = "f" ] || { echo "sensei_app IS a member of sensei_governance_definer (definer boundary collapsed): '$APP_DEF_MEMBERSHIP'"; exit 1; }
          # (d-5) sensei_app on the migrator-owned schema: schema CREATE is
          #      REFUSED (REVOKE ... FROM PUBLIC + FROM sensei_app), and a
          #      migrated tenant table is SELECTable through the default
          #      privileges declared FOR ROLE sensei_migrator.
          export PGUSER=sensei_app PGPASSWORD=x
          APP_FLAGS="$(psql -X -q -tAc "SELECT rolsuper || '/' || rolbypassrls || '/' || rolcreatedb || '/' || rolcreaterole FROM pg_roles WHERE rolname = 'sensei_app'")"
          [ "$APP_FLAGS" = "false/false/false/false" ] || { echo "sensei_app is not least-privilege: '$APP_FLAGS'"; exit 1; }
          CREATE_OUT="$(psql -X -q -v ON_ERROR_STOP=1 -c 'CREATE TABLE sensei_app_probe (id int)' 2>&1 || true)"
          case "$CREATE_OUT" in
            *"permission denied for schema public"*) : ;;
            *) echo "sensei_app could CREATE TABLE on the migrator-owned schema: '$CREATE_OUT'"; exit 1;;
          esac
          SELECT_OUT="$(psql -X -q -tAc 'SELECT COUNT(*) FROM products')"
          # (d-5-2) The app role's governance-function surface on the clean
          #      bootstrap (twenty-eighth audit P0): EXECUTE ONLY on the
          #      no-argument federation_governance_edges() — PUBLIC keeps
          #      EXECUTE on that form (migration 156) and the canonical
          #      script grants it explicitly once the function exists. An
          #      ACTUAL call must succeed (the clean database has no rows,
          #      so it returns nothing — but the SECURITY DEFINER body
          #      runs with the definer's privileges, so success also
          #      proves the step-(c) post-migration table grants). The
          #      migration/admin-only _for(uuid) variant is REFUSED: it is
          #      revoked from PUBLIC and never granted to the app role.
          HAS_APP_EDGES="$(psql -X -q -tAc "SELECT has_function_privilege('sensei_app', p.oid, 'EXECUTE') FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname = 'federation_governance_edges' AND p.pronargs = 0")"
          [ "$HAS_APP_EDGES" = "t" ] || { echo "sensei_app lacks EXECUTE on federation_governance_edges(): '$HAS_APP_EDGES'"; exit 1; }
          GOV_EXEC="$(psql -X -q -v ON_ERROR_STOP=1 -tAc 'SELECT peer_country FROM federation_governance_edges()')"
          HAS_APP_FOR="$(psql -X -q -tAc "SELECT has_function_privilege('sensei_app', p.oid, 'EXECUTE') FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname = 'federation_governance_edges_for' AND p.pronargs = 1")"
          [ "$HAS_APP_FOR" = "f" ] || { echo "sensei_app HAS EXECUTE on federation_governance_edges_for(uuid): '$HAS_APP_FOR'"; exit 1; }
          GOV_FOR="$(psql -X -q -v ON_ERROR_STOP=1 -tAc "SELECT peer_country FROM federation_governance_edges_for('00000000-0000-4000-8000-00000000000a')" 2>&1 || true)"
          case "$GOV_FOR" in
            *"permission denied for function"*) : ;;
            *) echo "federation_governance_edges_for(uuid) was not denied for the app role on the clean bootstrap: '$GOV_FOR'"; exit 1;;
          esac
          # (d-6) The definer's OWN schema + table privileges on the clean
          #      bootstrap (twenty-eighth audit P0): a direct
          #      SET ROLE sensei_governance_definer SELECT would prove
          #      nothing — with no app.tenant_id context the FORCE-RLS
          #      policy filters every row out regardless of privileges —
          #      so probe has_schema_privilege / has_table_privilege
          #      instead. These are exactly the privileges the migration
          #      165 owner transfer (schema USAGE+CREATE from the
          #      step-(a) run) and the definer-owned SECURITY DEFINER
          #      bodies (SELECT on the four federation tables from the
          #      step-(c) run; BYPASSRLS alone does not grant table
          #      SELECT) execute under.
          DEFINER_PRIVS="$(PGUSER=sensei PGPASSWORD=sensei_test psql -X -q -v ON_ERROR_STOP=1 -d clean_bootstrap <<'SQL' 2>&1)"
          DO $$
          DECLARE
              t text;
              granted boolean;
          BEGIN
              IF NOT has_schema_privilege('sensei_governance_definer', 'public', 'USAGE') THEN
                  RAISE EXCEPTION 'sensei_governance_definer lacks USAGE on schema public';
              END IF;
              IF NOT has_schema_privilege('sensei_governance_definer', 'public', 'CREATE') THEN
                  RAISE EXCEPTION 'sensei_governance_definer lacks CREATE on schema public (migration 165''s ALTER FUNCTION OWNER requires it)';
              END IF;
              FOREACH t IN ARRAY ARRAY['federation_memberships', 'site_manifests',
                                        'country_policies', 'country_policy_versions'] LOOP
                  EXECUTE format('SELECT has_table_privilege(%L, %L, %L)',
                                 'sensei_governance_definer', 'public.' || t, 'SELECT') INTO granted;
                  IF NOT granted THEN
                      RAISE EXCEPTION 'sensei_governance_definer lacks SELECT on public.% (the SECURITY DEFINER governance bodies read it; BYPASSRLS does not grant table SELECT)', t;
                  END IF;
              END LOOP;
          END
          $$;
          SQL
          echo "clean bootstrap OK: migrations=$MIGRATED migrator_flags=$FLAGS table_owner=$TABLE_OWNER fn_owner=$FN_OWNER"
          echo "  governance-definer role flags=$DEFINER_FLAGS membership=$DEF_MEMBERSHIP app_member=$APP_DEF_MEMBERSHIP"
          echo "  definer schema/table privileges OK (has_schema_privilege USAGE+CREATE; has_table_privilege SELECT on the four federation tables)"
          echo "  sensei_app CREATE denied (permission denied for schema public); SELECT on products returned count=$SELECT_OUT"
          echo "  sensei_app governance surface: edges() EXECUTE ok (has_privilege=$HAS_APP_EDGES); _for(uuid) permission denied (has_privilege=$HAS_APP_FOR)"
