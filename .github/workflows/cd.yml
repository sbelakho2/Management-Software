name: CD - Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/cd.yml'

env:
  # Use git SHA for reproducible image tags
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Environment protection requires approval before deployment
    # Configure this in GitHub repo settings: Settings > Environments > production
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/sensei-api:${{ env.IMAGE_TAG }}
            ${{ secrets.REGISTRY_URL }}/sensei-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/sensei-web:${{ env.IMAGE_TAG }}
            ${{ secrets.REGISTRY_URL }}/sensei-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'
      
      - name: Lint Helm Chart
        run: helm lint k8s/helm/sensei
      
      - name: Dry-run Helm Install
        run: |
          helm install sensei-os k8s/helm/sensei \
            --namespace sensei-production \
            --create-namespace \
            --set global.imageRegistry="${{ secrets.REGISTRY_URL }}" \
            --set image.backend.tag=${{ env.IMAGE_TAG }} \
            --set image.frontend.tag=${{ env.IMAGE_TAG }} \
            --dry-run --debug
      
      - name: Set up Kubeconfig
        if: github.event_name != 'pull_request'
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      
      - name: Deploy to K8s
        if: github.event_name != 'pull_request'
        run: |
          helm upgrade --install sensei-os k8s/helm/sensei \
            --namespace sensei-production \
            --create-namespace \
            --set global.imageRegistry=${{ secrets.REGISTRY_URL }} \
            --set image.backend.tag=${{ env.IMAGE_TAG }} \
            --set image.frontend.tag=${{ env.IMAGE_TAG }} \
            --wait --timeout 10m0s
      
      - name: Verify Deployment
        if: github.event_name != 'pull_request'
        run: |
          kubectl rollout status deployment/sensei-os-backend -n sensei-production --timeout=5m
          kubectl rollout status deployment/sensei-os-frontend -n sensei-production --timeout=5m
